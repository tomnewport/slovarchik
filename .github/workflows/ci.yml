name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so gen-manifest can read each vocab file's last-changed
          # date from git (a shallow clone would fall back to the build time).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    # Needed so the video-link step can comment on the PR.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
      # Publish the report + recorded videos (the full-session walkthrough from
      # #322) so they can be downloaded from the run — even when e2e is red.
      - id: pw_artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
      # Surface *this build's* recorded video inside the PR: upsert a single
      # sticky comment linking the artifact (which contains video.webm) and the
      # run, so it's reachable in one click from the PR conversation.
      - name: Link e2e video on the PR
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- e2e-video -->'
            const artifactUrl = ${{ toJSON(steps.pw_artifact.outputs['artifact-url']) }}
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const sha = (context.payload.pull_request?.head?.sha || context.sha).slice(0, 7)
            const lines = [
              marker,
              '### 🎥 Full-session e2e video',
              '',
              `Playwright recorded this build's full-session walkthrough (commit \`${sha}\`).`,
              '',
              artifactUrl
                ? `- ▶️ **[Download the \`playwright-report\` artifact](${artifactUrl})** — contains \`video.webm\` (open it in any browser).`
                : `- ▶️ Artifact not produced for this run.`,
              `- 🔧 [View the workflow run](${runUrl})`,
              '',
              '_The GitHub Actions artifacts UI hosts the video per build; it refreshes on every push._',
            ]
            const body = lines.join('\n')
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number })
            const existing = comments.find((c) => c.body && c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
