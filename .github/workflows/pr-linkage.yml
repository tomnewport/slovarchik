name: PR issue link

# Fails a pull request whose body has no issue-closing reference
# (Closes/Fixes/Resolves #N). GitHub only auto-closes issues from a closing
# keyword in the PR *body* — a "#123" in the title does nothing — so this guards
# against work shipping while its tracking issue is silently orphaned open.
#
# Bypass: add the `no-issue` label to a PR that intentionally closes no issue.
# Dependabot PRs are skipped automatically.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

jobs:
  require-closes:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const labels = (pr.labels || []).map((l) => l.name);

            if (labels.includes('no-issue')) {
              core.info('`no-issue` label present — skipping the issue-link check.');
              return;
            }

            // GitHub's closing keywords, followed by #123, owner/repo#123, or a
            // full issues URL. Case-insensitive; keyword and reference on one line.
            const body = pr.body || '';
            const re =
              /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\b\s+(?:[\w.-]+\/[\w.-]+#|#|https?:\/\/github\.com\/[\w.-]+\/[\w.-]+\/issues\/)\d+/i;

            if (re.test(body)) {
              core.info('Found an issue-closing reference in the PR body. ✔');
              return;
            }

            core.setFailed(
              'This PR body has no issue-closing reference.\n\n' +
                'Add a line like "Closes #123" (or Fixes / Resolves) to the PR *body* ' +
                'so the issue auto-closes on merge — a mention in the title does not count.\n' +
                'If this PR intentionally closes no issue, add the `no-issue` label.',
            );
