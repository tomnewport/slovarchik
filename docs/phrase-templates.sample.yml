# phrase-templates.sample.yml — proposed Phase 2 "battery" of carrier phrases.
#
# A carrier phrase fixes everything except the target word, so the form the
# learner must produce is fully determined by the slot and read straight from
# the word's paradigm (paradigm.js). The blank `___` marks the slot; `en` mirrors
# it on the English side (the English headword is filled in at runtime).
#
# slot keys map to paradigm cells:
#   noun       → cell `<case>.<number>`           (e.g. gen.pl)
#   adjective  → cell `<case>.<gender|pl>`        (e.g. gen.f)  [acc = inanimate]
#   pronoun    → adjective-like reuse the adjective set; personal/что-кто use `<case>._`
#   verb       → finite `<person>.finite` / past `<past_*>.past`
#
# `tags` are matched against a word's existing `collections:` for semantic fit;
# every slot also has at least one generic template so no word is ever stranded.
#
# Caveats (documented, not blockers):
#   - о/об and в/во alternate before vowels; templates pick consonant-friendly
#     carriers. The grader is stress/ё-lenient, so a wrong preposition vowel in
#     the *carrier* is never the graded token anyway.
#   - Masculine animate accusative (= genitive) is not separately stored for
#     adjectives, so adjective acc uses an inanimate carrier (acc = nom).
#   - Prepositional-case pronouns force the н- form (о нём); other pronoun cases
#     use preposition-free carriers to avoid the него/его split.

# ───────────────────────────── NOUNS ──────────────────────────────
# One slot per (case); the same carrier serves singular and plural — the slot's
# `number` just selects which paradigm cell to elicit. (2 carriers per case.)
noun:
  - { slot: { case: nom }, ru: "Вот ___.",            en: "Here is/are ___.",            tags: [generic] }
  - { slot: { case: nom }, ru: "___ уже́ здесь.",       en: "___ is/are already here.",    tags: [generic] }
  - { slot: { case: gen }, ru: "У меня́ нет ___.",      en: "I don't have ___.",           tags: [generic] }
  - { slot: { case: gen }, ru: "Э́то о́коло ___.",       en: "It's near ___.",              tags: [places, home] }
  - { slot: { case: dat }, ru: "Я иду́ к ___.",         en: "I'm going towards ___.",      tags: [places, people] }
  - { slot: { case: dat }, ru: "Я дал э́то ___.",       en: "I gave this to ___.",         tags: [people, animals] }
  - { slot: { case: acc }, ru: "Я ви́жу ___.",          en: "I see ___.",                  tags: [generic] }
  - { slot: { case: acc }, ru: "Я о́чень люблю́ ___.",   en: "I really love ___.",          tags: [generic] }
  - { slot: { case: ins }, ru: "Я интересу́юсь ___.",   en: "I'm interested in ___.",      tags: [generic] }
  - { slot: { case: ins }, ru: "Я горжу́сь ___.",       en: "I'm proud of ___.",           tags: [people, work, family] }
  - { slot: { case: pre }, ru: "Я ду́маю о ___.",       en: "I'm thinking about ___.",     tags: [generic] }
  - { slot: { case: pre }, ru: "Мы говори́ли о ___.",   en: "We were talking about ___.",  tags: [generic] }

# ─────────────────────────── ADJECTIVES ───────────────────────────
# Carrier noun fixed per gender (m=дом, f=кни́га, n=окно́, pl=кни́ги) and declined
# through every case in the template string; the adjective agrees and is the slot.
adjective:
  # Masculine — дом (inanimate)
  - { slot: { gender: m, case: nom }, ru: "Вот ___ дом.",                    en: "Here is a ___ house.",            tags: [generic] }
  - { slot: { gender: m, case: gen }, ru: "Я живу́ недалеко́ от ___ до́ма.",    en: "I live not far from a ___ house.", tags: [generic] }
  - { slot: { gender: m, case: dat }, ru: "Мы идём к ___ до́му.",             en: "We're walking towards a ___ house.", tags: [generic] }
  - { slot: { gender: m, case: acc }, ru: "Я ви́жу ___ дом.",                 en: "I see a ___ house.",              tags: [generic] }
  - { slot: { gender: m, case: ins }, ru: "Я живу́ ря́дом с ___ до́мом.",       en: "I live next to a ___ house.",     tags: [generic] }
  - { slot: { gender: m, case: pre }, ru: "Мы говори́м о ___ до́ме.",          en: "We're talking about a ___ house.", tags: [generic] }
  # Feminine — кни́га
  - { slot: { gender: f, case: nom }, ru: "Вот ___ кни́га.",                  en: "Here is a ___ book.",             tags: [generic] }
  - { slot: { gender: f, case: gen }, ru: "У меня́ нет ___ кни́ги.",           en: "I don't have a ___ book.",        tags: [generic] }
  - { slot: { gender: f, case: dat }, ru: "Благодаря́ ___ кни́ге я всё по́нял.", en: "Thanks to a ___ book I understood everything.", tags: [generic] }
  - { slot: { gender: f, case: acc }, ru: "Я чита́ю ___ кни́гу.",              en: "I'm reading a ___ book.",         tags: [generic] }
  - { slot: { gender: f, case: ins }, ru: "Я интересу́юсь ___ кни́гой.",       en: "I'm interested in a ___ book.",   tags: [generic] }
  - { slot: { gender: f, case: pre }, ru: "Мы говори́м о ___ кни́ге.",         en: "We're talking about a ___ book.", tags: [generic] }
  # Neuter — окно́
  - { slot: { gender: n, case: nom }, ru: "Вот ___ окно́.",                   en: "Here is a ___ window.",           tags: [generic] }
  - { slot: { gender: n, case: gen }, ru: "Я стою́ о́коло ___ окна́.",          en: "I'm standing near a ___ window.", tags: [generic] }
  - { slot: { gender: n, case: dat }, ru: "Я подошёл к ___ окну́.",           en: "I went up to a ___ window.",      tags: [generic] }
  - { slot: { gender: n, case: acc }, ru: "Я ви́жу ___ окно́.",               en: "I see a ___ window.",             tags: [generic] }
  - { slot: { gender: n, case: ins }, ru: "Я стою́ ря́дом с ___ окно́м.",       en: "I'm standing next to a ___ window.", tags: [generic] }
  - { slot: { gender: n, case: pre }, ru: "Мы говори́м о ___ окне́.",          en: "We're talking about a ___ window.", tags: [generic] }
  # Plural — кни́ги
  - { slot: { gender: pl, case: nom }, ru: "Вот ___ кни́ги.",                 en: "Here are some ___ books.",        tags: [generic] }
  - { slot: { gender: pl, case: gen }, ru: "У меня́ нет ___ книг.",           en: "I don't have any ___ books.",     tags: [generic] }
  - { slot: { gender: pl, case: dat }, ru: "Благодаря́ ___ кни́гам.",          en: "Thanks to some ___ books.",       tags: [generic] }
  - { slot: { gender: pl, case: acc }, ru: "Я чита́ю ___ кни́ги.",             en: "I'm reading some ___ books.",     tags: [generic] }
  - { slot: { gender: pl, case: ins }, ru: "Я интересу́юсь ___ кни́гами.",     en: "I'm interested in some ___ books.", tags: [generic] }
  - { slot: { gender: pl, case: pre }, ru: "Мы говори́м о ___ кни́гах.",       en: "We're talking about some ___ books.", tags: [generic] }

# ──────────────────────────── PRONOUNS ────────────────────────────
# Adjective-like pronouns (мой, твой, наш, э́тот, тот, како́й, чей, весь, сам)
# decline like adjectives → they reuse the `adjective:` battery above; no extra
# templates needed. Personal + interrogative (кто/что) decline by case only and
# use preposition-free carriers (except the prepositional, which must take о):
pronoun:
  - { slot: { case: nom }, ru: "___ уже́ здесь.",      en: "___ is/are already here.",  tags: [personal] }
  - { slot: { case: gen }, ru: "___ нет до́ма.",        en: "___ is/are not home.",      tags: [personal] }  # Меня́ нет до́ма
  - { slot: { case: dat }, ru: "Да́йте ___ кни́гу.",    en: "Give ___ the book.",        tags: [personal] }  # дайте мне / ему́
  - { slot: { case: acc }, ru: "Я ви́жу ___.",          en: "I see ___.",                tags: [personal] }  # ви́жу его́ / их (no н-)
  - { slot: { case: ins }, ru: "Я горжу́сь ___.",       en: "I'm proud of ___.",         tags: [personal] }  # горжу́сь им / и́ми (no н-)
  - { slot: { case: pre }, ru: "Я ду́маю о ___.",       en: "I'm thinking about ___.",   tags: [personal] }  # о нём / о ней (н- form)

# ────────────────────────────── VERBS ─────────────────────────────
# The lemma (infinitive) is the prompt; the learner conjugates it for the carrier
# subject. Adverbial carriers keep it intransitive-safe (no object needed).
# Imperfective → present finite; perfective → future finite (matched by aspect).
verb:
  # Present (imperfective): habitual adverbs
  - { slot: { person: "1sg", tense: present }, ru: "Я ча́сто ___.",     en: "I often ___.",          tags: [generic] }
  - { slot: { person: "2sg", tense: present }, ru: "Ты ча́сто ___?",    en: "Do you often ___?",     tags: [generic] }
  - { slot: { person: "3sg", tense: present }, ru: "Он ре́дко ___.",    en: "He rarely ___.",        tags: [generic] }
  - { slot: { person: "1pl", tense: present }, ru: "Мы ча́сто ___.",    en: "We often ___.",         tags: [generic] }
  - { slot: { person: "2pl", tense: present }, ru: "Вы ча́сто ___?",    en: "Do you often ___?",     tags: [generic] }
  - { slot: { person: "3pl", tense: present }, ru: "Они́ всегда́ ___.",  en: "They always ___.",      tags: [generic] }
  # Future (perfective): за́втра + perfective
  - { slot: { person: "1sg", tense: future }, ru: "За́втра я ___.",      en: "Tomorrow I will ___.",   tags: [generic] }
  - { slot: { person: "3sg", tense: future }, ru: "За́втра он ___.",     en: "Tomorrow he will ___.",  tags: [generic] }
  - { slot: { person: "3pl", tense: future }, ru: "За́втра они́ ___.",    en: "Tomorrow they will ___.", tags: [generic] }
  # Past (gender/number agreement)
  - { slot: { past: "past_m" }, ru: "Вчера́ он ___.",   en: "Yesterday he ___.",        tags: [generic] }
  - { slot: { past: "past_f" }, ru: "Вчера́ она́ ___.",  en: "Yesterday she ___.",       tags: [generic] }
  - { slot: { past: "past_n" }, ru: "Вчера́ всё ___.",   en: "Yesterday everything ___.", tags: [generic] }
  - { slot: { past: "past_pl" }, ru: "Вчера́ они́ ___.", en: "Yesterday they ___.",      tags: [generic] }
