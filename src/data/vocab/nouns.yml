# nouns.yml — Russian nouns
# Natural key: "<russian>=<english>" (disambiguates homophones).
# Stress is marked with a combining acute accent (´, U+0301) on the vowel.
---
meta:
  gender:
    m: masculine
    f: feminine
    n: neuter
  animacy:
    a: animate
    i: inanimate
  number:
    sg: singular
    pl: plural
  case:
    nom: nominative
    gen: genitive
    dat: dative
    acc: accusative
    ins: instrumental
    pre: prepositional
  declension:
    sg_nom: nominative singular
    pl_nom: nominative plural
words:
  "вода=water":
    cefr_level: A1
    gender: f
    animacy: i
    number: ["sg", "pl"]
    collections:
      - in the kitchen
      - nature
    en_gb:
      standard: water (the clear liquid you drink)
    usage:
      - ru: Я пью́ во́ду ка́ждое у́тро.
        en_gb: I drink water every morning.
    declension:
      sg_nom: вода́
      sg_gen: воды́
      sg_dat: воде́
      sg_acc: во́ду
      sg_ins: водо́й
      sg_pre: воде́
      pl_nom: во́ды
      pl_gen: вод
      pl_dat: во́дам
      pl_acc: во́ды
      pl_ins: во́дами
      pl_pre: во́дах
