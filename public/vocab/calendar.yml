# calendar.yml — calendar nouns: days of the week, months and festivals.
# These are ordinary nouns (loaded as part of speech "noun") gathered into one
# file so the topical sets stay together; they carry collection tags so the app
# can group them ("the calendar" for days and months, "holiday" for festivals).
# Natural key: "<russian>=<english>" (disambiguates homophones).
# Stress is marked with a combining acute accent (´, U+0301) on the vowel.
---
meta:
  gender:
    m: masculine
    f: feminine
    n: neuter
  animacy:
    a: animate
    i: inanimate
  number:
    sg: singular
    pl: plural
  case:
    nom: nominative
    gen: genitive
    dat: dative
    acc: accusative
    ins: instrumental
    pre: prepositional
words:
