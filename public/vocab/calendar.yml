# calendar.yml — calendar nouns: days of the week, months and festivals.
# These are ordinary nouns (loaded as part of speech "noun") gathered into one
# file so the topical sets stay together; they carry collection tags so the app
# can group them ("the calendar" for days and months, "holiday" for festivals).
# Natural key: "<russian>=<english>" (disambiguates homophones).
# Stress is marked with a combining acute accent (´, U+0301) on the vowel.
---
meta:
  gender:
    m: masculine
    f: feminine
    n: neuter
  animacy:
    a: animate
    i: inanimate
  number:
    sg: singular
    pl: plural
  case:
    nom: nominative
    gen: genitive
    dat: dative
    acc: accusative
    ins: instrumental
    pre: prepositional
words:
  "август=August":
    cefr_level: A1
    gender: m
    animacy: i
    number: ["sg", "pl"]
    collections:
      - the calendar
    en_gb:
      standard: August (the eighth month)
    usage:
      - ru: В а́вгусте мы е́здили на мо́ре.
        en_gb: In August we went to the seaside.
        en_alt:
          - In August we went to the sea.
        inflect: { token: 2, case: pre, number: sg, rule: noun-pre-sg }
      - ru: А́вгуст — после́дний ме́сяц ле́та.
        en_gb: August is the last month of summer.
        inflect: { token: 1, case: nom, number: sg, rule: noun-nom-sg }
      - ru: К а́вгусту созрева́ют фру́кты.
        en_gb: By August the fruit ripens.
        inflect: { token: 2, case: dat, number: sg, rule: noun-dat-sg }
