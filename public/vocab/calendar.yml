  "понедельник=Monday":
    cefr_level: A1
    gender: m
    animacy: i
    number: ["sg", "pl"]
    collections:
      - the calendar
    en_gb:
      standard: Monday (the first day of the week)
    usage:
      - ru: В понеде́льник я иду́ на рабо́ту.
        en_gb: On Monday I go to work.
