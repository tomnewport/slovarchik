# adverbs.yml — Russian adverbs (mostly invariable)
---
meta:
  form:
    comparative: comparative degree
words:
  "близко=near":
    cefr_level: A1
    accented: бли́зко
    collections:
      - measurement and calculation
      - places
    en_gb:
      standard: near (a short distance away)
      alt:
        - close
    usage:
      - ru: Магази́н совсе́м бли́зко.
        en_gb: The shop is very near.
    forms:
      comparative: бли́же
  "быстро=quickly":
    cefr_level: A2
    accented: бы́стро
    en_gb:
      standard: quickly (at high speed)
      alt:
        - fast
    usage:
      - ru: Он бы́стро бежи́т.
        en_gb: He runs quickly.
    forms:
      comparative: быстре́е
  "вместе=together":
    cefr_level: A2
    accented: вме́сте
    collections:
      - family
      - romance and dating
      - daily life
    en_gb:
      standard: together (with one another)
    usage:
      - ru: Мы всегда́ вме́сте.
        en_gb: We are always together.
  "всегда=always":
    cefr_level: A1
    accented: всегда́
    en_gb:
      standard: always (every time)
    usage:
      - ru: Я всегда́ пью́ ча́й у́тром.
        en_gb: I always drink tea in the morning.
  "громко=loudly":
    cefr_level: A2
    accented: гро́мко
    collections:
      - the arts
      - feelings and sensations
    en_gb:
      standard: loudly (with much noise)
    usage:
      - ru: Не говори́ так гро́мко!
        en_gb: Don't speak so loudly!
    forms:
      comparative: гро́мче
  "далеко=far":
    cefr_level: A1
    accented: далеко́
    collections:
      - travel
      - measurement and calculation
      - places
    en_gb:
      standard: far (a long distance away)
    usage:
      - ru: Шко́ла далеко́ от до́ма.
        en_gb: The school is far from home.
    forms:
      comparative: да́льше
  "дорого=expensively":
    cefr_level: A2
    accented: до́рого
    collections:
      - finance
      - shopping
    en_gb:
      standard: expensively (at a high price)
    usage:
      - ru: Здесь всё сто́ит до́рого.
        en_gb: Everything is expensive here.
    forms:
      comparative: доро́же
  "здесь=here":
    cefr_level: A1
    accented: здесь
    en_gb:
      standard: here (in this place)
    usage:
      - ru: Я живу́ здесь.
        en_gb: I live here.
  "медленно=slowly":
    cefr_level: A2
    accented: ме́дленно
    en_gb:
      standard: slowly (at low speed)
    usage:
      - ru: Говори́те ме́дленно, пожа́луйста.
        en_gb: Please speak slowly.
    forms:
      comparative: медле́ннее
  "плохо=badly":
    cefr_level: A1
    accented: пло́хо
    en_gb:
      standard: badly (not well)
    usage:
      - ru: Он пло́хо себя́ чу́вствует.
        en_gb: He feels bad.
    forms:
      comparative: ху́же
  "редко=rarely":
    cefr_level: B1
    accented: ре́дко
    en_gb:
      standard: rarely (not often)
      alt:
        - seldom
    usage:
      - ru: Мы ре́дко смо́трим телеви́зор.
        en_gb: We rarely watch television.
    forms:
      comparative: ре́же
  "сейчас=now":
    cefr_level: A1
    accented: сейча́с
    en_gb:
      standard: now (at this moment)
      alt:
        - right now
    usage:
      - ru: Я сейча́с за́нят.
        en_gb: I am busy now.
  "там=there":
    cefr_level: A1
    accented: там
    en_gb:
      standard: there (in that place)
    usage:
      - ru: Магази́н там, напра́во.
        en_gb: The shop is there, on the right.
  "тихо=quietly":
    cefr_level: A2
    accented: ти́хо
    collections:
      - feelings and sensations
      - faith
    en_gb:
      standard: quietly (with little noise)
    usage:
      - ru: В це́ркви на́до вести́ себя́ ти́хо.
        en_gb: In church you must behave quietly.
    forms:
      comparative: ти́ше
  "хорошо=well":
    cefr_level: A1
    accented: хорошо́
    en_gb:
      standard: well (in a good way)
      alt:
        - good
    usage:
      - ru: Она́ хорошо́ говори́т по-англи́йски.
        en_gb: She speaks English well.
    forms:
      comparative: лу́чше
  "часто=often":
    cefr_level: A1
    accented: ча́сто
    en_gb:
      standard: often (many times)
    usage:
      - ru: Мы ча́сто хо́дим в кино́.
        en_gb: We often go to the cinema.
    forms:
      comparative: ча́ще
