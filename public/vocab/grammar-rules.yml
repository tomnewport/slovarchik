# grammar-rules.yml — short rule / formula explanations for the in-context
# inflection drill. Each `inflect:` annotation on a word's usage example (in the
# per-part-of-speech vocab files) may carry a `rule:` id pointing here; the
# explanation is shown when the answer is revealed.
#
# Keep each rule to a one-line `formula` (how the ending is built) plus a short
# `explanation` and the most common exceptions. The explanation should lead with
# the case's *functions* — what it is for — not just how to form it, and call out
# the uses an English speaker won't expect (e.g. instrumental for a profession or
# the time of day, dative for age, prepositional for what someone is wearing), so
# the learner sees *why* the highlighted word takes the form it does.
#
# `contrast:` names a sibling rule the reveal offers alongside, collapsed — for a
# rule only intelligible against another one (#592): the genitive after два reads
# as arbitrary until you can see the genitive after мно́го next to it.
---
rules:
  # ── Nouns ───────────────────────────────────────────────────────────────
  noun-nom-sg:
    title: "Nominative singular"
    formula: "the dictionary form · marks the subject"
    explanation: >
      The nominative is the naming case — the form you find in the dictionary.
      It marks the subject: who or what does the action (Соба́ка спит), and the
      predicate after «—» (Москва́ — большо́й го́род). Because Russian word order
      is free, the nominative — not position — tells you the subject: in Кни́гу
      чита́ет ма́ма it's ма́ма who reads, even though it comes last. When two
      nouns share a form (Мать лю́бит дочь), the nominative is the one doing the
      loving. The singular nominative never changes — it's the base form.
  noun-nom-pl:
    title: "Nominative plural"
    formula: "m/f -а/-ы(-и) · n -а/-я · marks the subject"
    explanation: >
      The nominative plural names more than one subject (Де́ти игра́ют).
      Masculine and feminine nouns usually take -ы/-и (столы́, кни́ги),
      neuters take -а/-я (о́кна, поля́); a set of masculines take stressed -а́
      (дома́, города́, учителя́). It marks the subject or the predicate after «—»,
      just like the singular.
  noun-gen-sg:
    title: "Genitive singular"
    formula: "m/n → -а / -я · f → -ы / -и"
    explanation: >
      The genitive answers "of whom/what" and has many jobs: possession (кни́га
      бра́та), origin / "from" after из, с, от (из Москвы́), absence and negation
      (нет вре́мени, без са́хара), and quantity (стака́н воды́, мно́го). Crucially
      it is also the form after the numbers two, three and four (два часа́, три
      угла́) and in comparisons (ста́рше бра́та). It follows у, для, до, по́сле,
      о́коло and verbs of fearing/wanting (боя́ться темноты́). Forms: m/n take
      -а/-я; feminine -а nouns take -ы (-и after к, г, х, ж, ш, щ, ч).
    exceptions:
      - "Feminine -ь nouns take -и: но́чь → но́чи."
      - "Some masculine nouns use a partitive -у: ча́ю, са́хару."

  noun-gen-pl:
    title: "Genitive plural"
    formula: "m → -ов/-ев/-ей · f, n → zero ending"
    explanation: >
      Same jobs as the genitive singular — possession, absence (нет друзе́й),
      quantity — but this is also the form after five and above and after мно́го,
      ма́ло, не́сколько, ско́лько (пять рубле́й, мно́го стран). The hardest case
      to form: masculine nouns usually add -ов (-ев after soft stems, -ей after
      ж, ш, щ, ч, ь). Feminine -а and neuter -о nouns most often take a ZERO
      ending, which can insert a fleeting vowel: окно́ → о́кон, де́вушка →
      де́вушек.
    exceptions:
      - "Soft feminine/neuter stems take -ей: но́чь → ноче́й, мо́ре → море́й."
      - "Irregulars: челове́к → люде́й, ребёнок → дете́й."

  # ── Counting and quantity (#592) ────────────────────────────────────────
  # The plain genitive rules above list this among six other jobs, which leaves
  # the learner to work out which one is operating — and the word that decides
  # it (два, мно́го) is never the word being highlighted. These three name the
  # trigger, and `contrast:` puts the sibling rule beside each so the pair can
  # be read together.
  noun-count-gen-sg:
    title: "Genitive singular after two, three, four"
    formula: "2, 3, 4 — and 22, 33, 104 — + genitive SINGULAR"
    explanation: >
      After два/две, три and четы́ре a noun takes the genitive SINGULAR: два
      часа́, три угла́, две кни́ги. It is the LAST DIGIT that decides, so a
      compound follows the same rule — два́дцать два па́рка, but два́дцать шесть
      па́рков. This is not really a genitive at all: it is a fossilised dual, the
      old form for exactly two, which is why its stress can differ from the true
      genitive singular — два шага́ against ша́га. It applies only while the
      phrase is the subject or the direct object; once a preposition puts it in
      another case everything agrees normally, в двух больши́х па́рках.
    contrast: noun-count-gen-pl
    exceptions:
      - "оди́н reverts to the nominative singular, compounds included: два́дцать оди́н парк."
      - "11–14 take the genitive PLURAL despite ending in 1–4: оди́ннадцать домо́в."
      - "An adjective goes genitive PLURAL even though the noun is singular: два больши́х па́рка. Feminines may instead take the nominative plural: две больши́е кни́ги."

  noun-count-gen-pl:
    title: "Genitive plural after five, and after много"
    formula: "5 and up, мно́го, не́сколько + genitive PLURAL"
    explanation: >
      From пять upwards — and after мно́го, ма́ло, не́сколько, ско́лько — a
      countable noun takes the genitive PLURAL: пять рубле́й, мно́го стран. The
      last digit decides, so anything ending 5, 6, 7, 8, 9 or 0 belongs here
      while 2, 3 and 4 take the singular. A quantity phrase like this counts as
      neuter singular for the verb, which is why it is «В за́ле сиде́ло мно́го
      же́нщин» and not сиде́ли.
    contrast: noun-count-gen-sg
    exceptions:
      - "11–14 belong here despite ending in 1–4: двена́дцать ме́сяцев."
      - "An uncountable noun stays SINGULAR after the same quantity words: мно́го воды́, ма́ло вре́мени."

  noun-quantity-gen-sg:
    title: "Genitive singular after a quantity word"
    formula: "мно́го / ма́ло + an uncountable noun → genitive SINGULAR"
    explanation: >
      After мно́го, ма́ло, немно́го and ско́лько a noun you cannot count stays in
      the genitive SINGULAR: мно́го воды́, ма́ло вре́мени, немно́го са́хара. The
      very same words take the genitive plural the moment the noun is countable
      — мно́го книг — so here it is the NOUN, not the quantity word, that decides
      the number. It is the same genitive of quantity as стака́н воды́ and
      буты́лка молока́.
    contrast: noun-count-gen-pl
    exceptions:
      - "A substance counted in portions goes plural — два ко́фе, три пи́ва: the servings, not the stuff."

  noun-dat-sg:
    title: "Dative singular"
    formula: "m/n → -у / -ю · f → -е / -и"
    explanation: >
      The dative is the recipient or beneficiary — "to/for whom" (подари́ть
      дру́гу). It also follows к ("towards" someone/somewhere) and по (по у́лице,
      по телефо́ну); states a person's age, with the person in the dative (Бра́ту
      два́дцать лет); and is the experiencer in impersonal sentences (Студе́нту
      хо́лодно / нра́вится / ну́жно). Several verbs that look transitive in
      English govern it: помога́ть, звони́ть, ве́рить, меша́ть, сове́товать,
      зави́довать. Forms: m/n take -у/-ю; feminine -а nouns take -е.
    exceptions:
      - "Feminine -ия and -ь nouns take -и: ле́кция → ле́кции, мать → ма́тери."

  noun-dat-pl:
    title: "Dative plural"
    formula: "→ -ам / -ям"
    explanation: >
      Same jobs as the dative singular — recipient, к, по, age and the
      impersonal experiencer (Де́тям хо́лодно) — for plural recipients. All
      genders take -ам (-ям after soft stems): помога́ть друзья́м, по вечера́м.

  noun-acc-sg:
    title: "Accusative singular"
    formula: "f -а → -у · inanimate m/n = nominative · animate m = genitive"
    explanation: >
      The accusative is the direct object — who or what the verb acts on (Я
      ви́жу дом). It also marks motion/destination after в and на (е́ду в
      Москву́, на рабо́ту — contrast location, which is prepositional), duration
      ("for": весь день, всю неде́лю), and time points (в сре́ду, в час, ка́ждую
      неде́лю). Forms: feminine -а nouns take -у (-я → -ю); inanimate m/n look
      like the nominative; animate masculine nouns look like the genitive.
    exceptions:
      - "Feminine -ь nouns don't change: мать → мать, ночь → ночь."

  noun-acc-pl:
    title: "Accusative plural"
    formula: "inanimate = nominative pl · animate = genitive pl"
    explanation: >
      Same jobs as the accusative singular — direct object, motion after в/на,
      duration (все выходны́е). In the plural the form copies the nominative for
      inanimate nouns and the genitive for animate nouns, regardless of gender
      (ви́жу столы́ but ви́жу друзе́й).

  # ── Noun exceptions / irregulars ─────────────────────────────────────────
  noun-acc-animate:
    exception: true
    title: "Accusative patterns for animate nouns"
    formula: "pl animate = genitive · sg animate m 2nd decl. = genitive"
    explanation: >
      In the plural, the accusative of animate nouns of every gender copies the
      genitive: Я ви́жу друзе́й (= gen pl друзе́й). In the singular, this
      genitive-shaped accusative is the masculine second-declension pattern: Я
      ви́жу отца́ (= gen отца́). Other singular noun classes keep their own
      accusative forms: Я ви́жу ко́шку (feminine -а), па́пу (masculine
      first-declension), живо́е существо́ (neuter) — not ко́шки, па́пы or
      живо́го существа́.

  noun-genpl-fleeting:
    exception: true
    title: "Genitive plural — zero ending & fleeting vowel"
    formula: "-а/-о → ∅, often inserting -о-/-е-"
    explanation: >
      Feminine -а and neuter -о nouns usually take a ZERO ending in the genitive
      plural. When the bare stem ends in an awkward consonant cluster, a fleeting
      -о- or -е- is inserted: письмо́ → пи́сем, де́вушка → де́вушек, копе́йка →
      копе́ек, де́ньги → де́нег.

  noun-fem-soft:
    exception: true
    title: "Feminine -ь nouns (3rd declension)"
    formula: "ins sg → -ью · gen/dat/pre sg → -и"
    explanation: >
      Feminine nouns ending in -ь decline differently: the instrumental singular
      is -ью (но́чью, две́рью, до́черью) and the genitive/dative/prepositional
      singular is -и (но́чи). They never take -а endings.
    exceptions:
      - "мать and дочь insert -ер- in every form but nom/acc sg: ма́тери, до́черью."

  noun-mya-neuter:
    exception: true
    title: "Neuter -мя nouns"
    formula: "stem gains -ен- before endings"
    explanation: >
      The ten neuter nouns in -мя (и́мя, вре́мя, пле́мя…) insert -ен- before their
      endings: вре́мя → со вре́менем (ins), и́мени (gen/dat/pre). The plural keeps
      it too: имена́, времена́.

  noun-irregular-plural:
    exception: true
    title: "Irregular plural stems"
    formula: "друг → друзья́ · сын → сыновья́ · ребёнок → де́ти"
    explanation: >
      Some nouns switch to a different stem in the plural and decline from there:
      друг → друзья́, друзе́й, друзья́ми; брат → бра́тья; сын → сыновья́; ребёнок
      → де́ти, дете́й, детьми́; челове́к → лю́ди, люде́й, людьми́.

  noun-ins-sg:
    title: "Instrumental singular"
    formula: "m/n → -ом / -ем · f → -ой / -ей"
    explanation: >
      The instrumental marks the means or tool, with NO preposition (писа́ть
      ру́чкой, е́хать по́ездом). Its other jobs surprise English speakers: a
      profession or role after быть, стать and рабо́тать (рабо́тает врачо́м, стал
      лётчиком); the time of day or season as a bare form (у́тром, ве́чером,
      зимо́й, ле́том); the doer of a passive (постро́ен архите́ктором); and the
      object of verbs like интересова́ться, занима́ться, горди́ться,
      по́льзоваться, владе́ть. With с it means "(together) with" (с дру́гом), and
      it follows за, под, над, пе́ред. Forms: m/n take -ом/-ем; feminine -а nouns
      take -ой/-ей (-ей after soft stems and after ж, ш, щ, ч, ц when unstressed).
    exceptions:
      - "Feminine -ь nouns take -ью: но́чь → но́чью."

  noun-ins-pl:
    title: "Instrumental plural"
    formula: "→ -ами / -ями"
    explanation: >
      Same jobs as the instrumental singular — means, "(together) with" (с
      друзья́ми), profession (рабо́тают учителя́ми) and verbs like по́льзоваться
      (по́льзуются инструме́нтами). All genders take -ами (-ями after soft stems).
    exceptions:
      - "A few keep -ьми: детьми́, людьми́."

  noun-pre-sg:
    title: "Prepositional singular"
    formula: "→ -е (some -и / -у)"
    explanation: >
      Only ever used with a preposition. It marks location after в/на (в Москве́,
      на столе́ — contrast motion, which is accusative), the topic after о/об
      ("about": ду́мать о до́ме), the vehicle you travel in after на (на по́езде,
      на маши́не — where English says "by"), what someone is wearing after в (в
      пла́тье, в очка́х), and time containers (в ма́е, в де́тстве). Most nouns
      take -е.
    exceptions:
      - "Nouns in -ий/-ие/-ия and feminine -ь take -и: ле́кция → о ле́кции."
      - "Some masculine nouns take a stressed -у́ after в/на: в лесу́, в саду́."

  noun-locative:
    exception: true
    title: "Locative (second prepositional)"
    formula: "special в/на form · m → stressed -у́ · f -ь → stressed -и́"
    explanation: >
      A group of common nouns has a special "second prepositional" — the
      LOCATIVE — used only after в or на to say WHERE something is: в лесу́ (in
      the forest), на берегу́ (on the shore), в углу́ (in the corner), на полу́
      (on the floor), в аэропорту́, во рту́. It is spelled like the dative for
      masculine nouns and like the genitive/dative for feminine -ь nouns, but is
      always stressed on the ending — that end stress is what tells it apart
      from the ordinary prepositional (в лесу́, not в ле́се). Only these nouns
      have it, only in the singular, and only when в/на means location.
    exceptions:
      - "Motion INTO still takes the accusative: в лес (into the forest) vs в лесу́ (in the forest)."
      - "The topic sense keeps the ordinary prepositional: ду́мать о ле́се (about the forest)."
      - "Most nouns have no locative and just use the prepositional -е."

  noun-pre-pl:
    title: "Prepositional plural"
    formula: "→ -ах / -ях"
    explanation: >
      Same jobs as the prepositional singular — location (в города́х), topic
      ("about": о де́тях) and transport (на поезда́х) — for plurals. All genders
      take -ах (-ях after soft stems), after в/на and о/об.

  # ── Verbs ───────────────────────────────────────────────────────────────
  verb-present:
    title: "Present tense (imperfective)"
    formula: "1st conj. -ешь, -ет, … · 2nd conj. -ишь, -ит, …"
    explanation: >
      Imperfective verbs conjugate in the present. First-conjugation verbs take
      -ю/-у, -ешь, -ет, -ем, -ете, -ют/-ут; second-conjugation (mostly -ить
      verbs) take -ю/-у, -ишь, -ит, -им, -ите, -ят/-ат.
    exceptions:
      - "Consonant mutations in the 1st person: люби́ть → люблю́, ходи́ть → хожу́."

  verb-future:
    title: "Future tense"
    formula: "perfective: present-type endings · imperfective: бу́ду + infinitive"
    explanation: >
      A perfective verb has no present tense — its present-type endings express
      the (single, completed) future: я напишу́ = "I will write". Imperfective
      verbs form the future with бу́ду, бу́дешь… + the infinitive.

  verb-past:
    title: "Past tense"
    formula: "stem + -л / -ла / -ло / -ли"
    explanation: >
      The past tense agrees with the SUBJECT's gender and number, not person:
      -л (he), -ла (she), -ло (it), -ли (plural). Formed from the infinitive
      stem: чита́ть → чита́л, чита́ла, чита́ло, чита́ли.
    exceptions:
      - "Some masculine forms drop -л: нести́ → нёс, мочь → мог."

  verb-conditional:
    title: "Conditional (бы + past form)"
    formula: "бы + past-tense form · agrees with the subject's gender/number"
    explanation: >
      «бы» with the past-tense form expresses "would" — or "would have";
      Russian does not distinguish the two, context decides: Я бы пошёл =
      "I would go / I would have gone". The verb form is spelled exactly like
      the past tense and still agrees with the SUBJECT's gender and number
      (-л / -ла / -ло / -ли). «бы» floats — usually right after the subject
      or the verb: Я бы пошёл / Я пошёл бы. In an unreal condition BOTH
      halves take бы: Е́сли бы у меня́ бы́ло вре́мя, я бы пришёл. It also
      makes polite wishes: Я бы хоте́л ко́фе — "I'd like a coffee".
    exceptions:
      - "что́бы already contains бы and takes the same past form — but that is purpose or wish (Я хочу́, что́бы ты знал), not a conditional."
      - "Never combine бы with a future or present form: я бы бу́ду is impossible."

  verb-imperative:
    title: "Imperative (command form)"
    formula: "3pl stem + -й / -и́ / -ь · plural adds -те"
    explanation: >
      The imperative gives a command or request: скажи́(те) "say", дай(те)
      "give", иди́(те) "go". Use the bare form with ты (someone you address
      informally) and add -те for вы (plural, or one person politely). Formed
      from the present/future stem: vowel stems take -й (чита́й), stems with
      end-stress take -и́ (скажи́, пиши́), stem-stressed consonant stems take -ь
      (гото́вь, встань). With пожа́луйста it turns into a polite request.
    exceptions:
      - "дать → дай · есть → ешь · лечь → ляг · пить → пей."
      - "е́хать/пое́хать borrow поезжа́й — there is no *едь."
      - "-авать verbs keep -ва́й: дава́й, встава́й, узнава́й."

  verb-aspect:
    title: "Aspect: imperfective or perfective?"
    formula: "impf = process / habit / repetition · pf = one completed action"
    explanation: >
      Most Russian verbs come in pairs that share a meaning but differ in
      aspect. The IMPERFECTIVE (говори́ть, чита́ть) presents the action as a
      process, a habit or a repetition — anything ongoing or unfinished; it is
      the only aspect with a true present tense. The PERFECTIVE (сказа́ть,
      прочита́ть) presents one whole, completed action or its result, so it has
      only past and future. Signals in the sentence decide: ка́ждый день,
      ча́сто, до́лго point to the imperfective; уже́, вдруг, one-off results and
      chains of consecutive events point to the perfective.
    exceptions:
      - "After начина́ть/конча́ть ('begin/finish doing') only the imperfective infinitive follows."
      - "A negated imperative usually goes imperfective: не говори́!"

  verb-motion-pair:
    exception: true
    title: "Verbs of motion: one direction or not?"
    formula: "идти́/е́хать = one trip, one direction · ходи́ть/е́здить = habitually, there and back"
    explanation: >
      Nine of the commonest verbs come as a pair of IMPERFECTIVES, and the
      choice between them is not aspect but direction. The DETERMINATE member
      (идти́, е́хать, бежа́ть, лете́ть, плыть, нести́, вести́, везти́) describes one
      journey under way in one direction: «Я иду́ в шко́лу» — I am on my way
      there now. The INDETERMINATE member (ходи́ть, е́здить, бе́гать, лета́ть,
      пла́вать, носи́ть, води́ть, вози́ть) describes motion as a habit, a
      repetition, a round trip, or the bare ability: «Я хожу́ в шко́лу ка́ждый
      день», «Ребёнок уже́ хо́дит». Adverbs give it away — сейча́с, туда́ point to
      the determinate; ка́ждый день, ча́сто, обы́чно to the indeterminate.
    exceptions:
      - "A completed round trip goes in the indeterminate past: вчера́ я ходи́л в кино́ (went and came back)."
      - "The indeterminate member also carries the settled sense: носи́ть = to wear, води́ть = to drive (a car)."

  # ── Non-finite verb forms: participles and gerunds ───────────────────────
  # Причастия agree like adjectives and replace a кото́рый clause; деепричастия
  # are invariable and replace a second clause of time or manner. Both are the
  # register marker of written Russian, and both are unguessable from English,
  # where "-ing" covers all of them at once. See docs/participles-and-gerunds.md.
  verb-participle-act-pres:
    title: "Present active participle"
    formula: "3rd-plural stem + -ущ/-ющ/-ащ/-ящ + adjective endings"
    explanation: >
      The present active participle names the one DOING the action right now —
      "the crying child", "a passing car". Build it off the 3rd-person plural:
      чита́ют → чита́ющий, говоря́т → говоря́щий; first-conjugation verbs give
      -ущ/-ющ, second-conjugation -ащ/-ящ. It then agrees like но́вый, in gender,
      number and case, with the noun it describes: пла́чущего ребёнка. Its whole
      job is to compress a кото́рый clause — ребёнок, кото́рый пла́чет becomes
      пла́чущий ребёнок — which is why written Russian is full of them and speech
      much less so. Only imperfective verbs have one: a perfective has no present
      tense to build it from.
    exceptions:
      - "Some have hardened into ordinary adjectives: сле́дующий (next), настоя́щий (real), блестя́щий (brilliant)."
  verb-participle-act-past:
    title: "Past active participle"
    formula: "past stem + -вш- (-ш- after a consonant) + adjective endings"
    explanation: >
      The past active participle names the one who DID the action — "the man who
      read the letter". Take the past tense, drop the -л and add -вш-: чита́л →
      чита́вший, прочита́л → прочита́вший; a past with no -л takes bare -ш- (нёс →
      нёсший). Both aspects have one, and the aspect carries its usual meaning:
      чита́вший was reading, прочита́вший had finished. It agrees like но́вый and,
      like the present active, exists to replace a кото́рый clause in writing.
    exceptions:
      - "бы́вший (former) and уме́рший (deceased) are used as plain adjectives."
      - "Reflexives keep -ся after a vowel: верну́вшийся, not *верну́вшийсь."
  verb-participle-pass-pres:
    exception: true
    title: "Present passive participle"
    formula: "1st-plural + -ый · a small, bookish, closed class"
    explanation: >
      The present passive participle names what is BEING acted on — люби́мый
      "beloved / favourite", уважа́емый "respected", ведо́мый "led". Formally it is
      the 1st-person plural plus -ый (лю́бим → люби́мый), but treat it as
      vocabulary rather than as a productive rule: only a limited set of
      imperfective transitive verbs form one, it is markedly bookish, and modern
      Russian usually prefers an active sentence or a кото́рый clause instead.
      Several members are now simply adjectives or nouns (люби́мый "favourite",
      обвиня́емый "the accused"). Perfectives have none at all.
    exceptions:
      - "Second-conjugation -и́мый is rarer still: люби́мый, дели́мый, ви́димый."
      - "Many are far commoner negated: невозмо́жный, незабыва́емый, неулови́мый."
  verb-participle-pass-past:
    title: "Past passive participle"
    formula: "-нн- / -ённ- / -т- + adjective endings · transitive perfectives"
    explanation: >
      The past passive participle names the thing that WAS acted on — "the book
      that was read", "a closed door". Verbs in -ать take -нн- (прочита́ть →
      прочи́танный), verbs in -и́ть take -ённ-/-енн- with a stem change (реши́ть →
      решённый, купи́ть → ку́пленный), and a short set in -ыть/-ить/-еть take -т-
      (закры́ть → закры́тый, приня́ть → при́нятый). Only transitive verbs form one,
      and in practice almost only perfectives. In the long form it agrees like
      но́вый and describes a noun; as a predicate it uses the SHORT form instead,
      which is the far commoner of the two.
    exceptions:
      - "Note the stress shift into the participle: приня́ть → при́нятый, нача́ть → на́чатый."
      - "-и́ть verbs mutate the stem: пригласи́ть → приглашённый, купи́ть → ку́пленный."
  verb-participle-short:
    exception: true
    title: "Short passive participle (the predicate)"
    formula: "one -н / -т: закры́т, закры́та, закры́то, закры́ты · agrees, no case"
    explanation: >
      This is the everyday half of the passive, and the one to learn first:
      «Магази́н закры́т», «Кни́га прочи́тана», «Всё гото́во». Drop one -н from the
      long form (прочи́танный → прочи́тан) and agree with the subject in gender and
      number only — no case, because it is a predicate, not a modifier. Russian
      uses it where English uses "is/was + past participle", with быть unspoken
      in the present: Дверь закры́та = "the door is closed". The stress is the
      trap — it very often moves onto the ending in the feminine, exactly as in
      short adjectives: при́нят but принята́, на́чат but начата́, про́дан but продана́.
    exceptions:
      - "Feminine stress shifts to the ending: принята́, начата́, взята́, продана́."
      - "With был/бу́дет it makes any tense: дверь была́ закры́та, бу́дет закры́та."
  verb-gerund-impf:
    title: "Imperfective gerund (деепричастие)"
    formula: "3rd-plural stem + -я (-а after ж, ш, щ, ч) · invariable"
    explanation: >
      The imperfective gerund names an action going on AT THE SAME TIME as the
      main verb — «Он шёл, напева́я» (he walked, humming). Build it off the
      3rd-person plural: чита́ют → чита́я, говоря́т → говоря́, слы́шат → слы́ша. It
      never changes form — no gender, number, case or person — because it leans
      entirely on the main verb, and that is also its one hard rule: the gerund
      and the main verb must share a subject. Plenty of ordinary verbs simply
      have no imperfective gerund at all (ждать, пить, петь, писа́ть, бежа́ть).
    exceptions:
      - "быть is suppletive: бу́дучи."
      - "Three have hardened into other parts of speech: благодаря́ and несмотря́ (prepositions), мо́лча (adverb)."
  verb-gerund-pf:
    title: "Perfective gerund (деепричастие)"
    formula: "past stem + -в (-вши(сь) for reflexives) · invariable"
    explanation: >
      The perfective gerund names an action finished BEFORE the main verb —
      «Поду́мав, он отве́тил» (having thought, he answered). Take the past tense,
      drop the -л and add -в: поду́мал → поду́мав, уви́дел → уви́дев; reflexives take
      -вшись (попроща́лся → попроща́вшись). Like the imperfective gerund it is
      invariable and must share its subject with the main verb. It is especially
      common negated, where English uses "without …ing": «Он отве́тил, не
      поду́мав», «Он ушёл не попроща́вшись».
    exceptions:
      - "A gerund clause is set off by commas — unless it has hardened into an adverb: Он ушёл не проща́ясь."
      - "Verbs whose past has no -л take -ши: принёс → принёсши."

  # ── Verb government ──────────────────────────────────────────────────────
  # Which case a verb puts its object in when it isn't the plain accusative —
  # a producing-Russian skill an English speaker can't guess. Marked as
  # exceptions so the drill surfaces them more often.
  verb-gov-dative:
    exception: true
    title: "Verbs that take the dative"
    formula: "помога́ть · звони́ть · ве́рить · нра́виться · сове́товать + dative"
    explanation: >
      Some verbs put their object in the DATIVE where English just uses a direct
      object: помога́ть (to help), звони́ть (to phone), ве́рить (to believe /
      trust), меша́ть (to disturb), сове́товать (to advise), зави́довать (to
      envy), удивля́ться (to be surprised at), ра́доваться (to be glad of),
      улыба́ться (to smile at), принадлежа́ть (to belong to). Я помога́ю ма́ме
      (not *ма́му), Я звоню́ дру́гу, Я ве́рю врачу́. Think of them as "give help /
      a call / trust TO someone". A verb of giving or telling — дари́ть,
      пока́зывать, объясня́ть, обеща́ть — puts the RECIPIENT in the dative and
      the thing given in the accusative: Я дарю́ подру́ге цветы́.
    exceptions:
      - "нра́виться turns the sentence around: the liked thing is nominative, the person dative (мне нра́вится кни́га)."
      - "So do каза́ться, сни́ться and удава́ться — the person is dative, never the subject (мне ка́жется, мне удало́сь)."
  verb-gov-genitive:
    exception: true
    title: "Verbs that take the genitive"
    formula: "ждать · боя́ться · жела́ть · тре́бовать · избега́ть + genitive"
    explanation: >
      A few verbs govern the GENITIVE: боя́ться (to fear), жела́ть (to wish),
      тре́бовать (to demand), каса́ться (to touch / concern), избега́ть (to
      avoid), добива́ться (to strive for), достига́ть (to reach) and ждать (to
      wait for) with a non-specific or abstract object. Я бою́сь соба́ки, Жела́ю
      сча́стья, Я жду авто́буса. (With a definite, concrete object ждать can take
      the accusative — жду ма́му — but the genitive is the safe default for
      things.) Проси́ть, иска́ть and хоте́ть also take the genitive for something
      abstract or uncounted — проси́ть по́мощи, хоте́ть ча́я — and the accusative
      for a definite thing: проси́ть де́ньги.
    exceptions:
      - "ждать takes the accusative for a specific person: жду ма́му, жду дру́га."
  verb-gov-instrumental:
    exception: true
    title: "Verbs that take the instrumental"
    formula: "интересова́ться · занима́ться · станови́ться · по́льзоваться + instrumental"
    explanation: >
      Several verbs — many of them reflexive -ся — govern the INSTRUMENTAL with
      no preposition: интересова́ться (to be interested in), занима́ться (to do /
      study), горди́ться (to be proud of), по́льзоваться (to use), владе́ть (to
      own), облада́ть (to possess), увлека́ться (to be keen on), рискова́ть (to
      risk). Она́ интересу́ется му́зыкой, Я занима́юсь спо́ртом, Мать горди́тся
      сы́ном. The other big group is "turning into / counting as": стать,
      станови́ться, явля́ться, оказа́ться, счита́ться, называ́ться, and рабо́тать /
      служи́ть in the sense of holding a post — Он стал врачо́м, Она́ рабо́тает
      учи́телем.

  # ── Verb government with a preposition ───────────────────────────────────
  # The other half of government: the verb demands a fixed preposition, and the
  # preposition brings its own case. The English gloss is what misleads here —
  # "depend ON" is `от`, not `на` — so each frame gets its own rule.
  verb-gov-prep-o-pre:
    exception: true
    title: "Verbs with о + prepositional"
    formula: "ду́мать · говори́ть · по́мнить + о + prepositional"
    explanation: >
      "About" something is о + the PREPOSITIONAL: ду́мать о рабо́те (to think
      about work), говори́ть о фи́льме, по́мнить о встре́че, мечта́ть о
      путеше́ствии, забы́ть о вре́мени, рассказа́ть о де́тстве. The preposition
      lengthens to об before a word starting with а, э, и, о or у (об исто́рии,
      об о́тпуске) and to обо in обо мне.
    exceptions:
      - "ду́мать над + instrumental means to ponder a problem, not to think about a thing."
  verb-gov-prep-na-acc:
    exception: true
    title: "Verbs with на + accusative"
    formula: "наде́яться · смотре́ть · влия́ть + на + accusative"
    explanation: >
      A group of verbs points AT something with на + the ACCUSATIVE — the
      accusative, not the prepositional, because the sense is direction:
      наде́яться на друзе́й (to hope for / rely on friends), смотре́ть на карти́ну
      (to look at a picture), влия́ть на пого́ду, оби́деться на бра́та (to take
      offence at), рассчи́тывать на по́мощь (to count on help), отвеча́ть на
      вопро́с (to answer a question).
  verb-gov-prep-ot-gen:
    exception: true
    title: "Verbs with от + genitive"
    formula: "зави́сеть · отказа́ться · уста́ть + от + genitive"
    explanation: >
      "From / on" in the sense of a source or a thing moved away from is от +
      the GENITIVE: зави́сеть от пого́ды (to depend ON the weather — от, never
      *на), отказа́ться от предложе́ния (to refuse an offer), уста́ть от рабо́ты
      (to be tired of work), страда́ть от бо́ли (to suffer from pain).
    exceptions:
      - "The English of зави́сеть is \"depend ON\", but the Russian preposition is от."
  verb-gov-prep-k-dat:
    exception: true
    title: "Verbs with к + dative"
    formula: "гото́виться · привы́кнуть · относи́ться + к + dative"
    explanation: >
      Movement or attitude TOWARDS something is к + the DATIVE: гото́виться к
      экза́мену (to prepare for an exam), привы́кнуть к хо́лоду (to get used to
      the cold), относи́ться к рабо́те серьёзно (to treat work seriously),
      обраща́ться к врачу́ (to turn to a doctor). Note that "prepare FOR" and
      "get used TO" are both к, not для or в.
  verb-gov-prep-v-pre:
    exception: true
    title: "Verbs with в + prepositional"
    formula: "уча́ствовать · сомнева́ться · нужда́ться + в + prepositional"
    explanation: >
      Taking part or being involved IN something is в + the PREPOSITIONAL:
      уча́ствовать в ко́нкурсе (to take part in a competition), сомнева́ться в
      отве́те (to doubt an answer), нужда́ться в по́мощи (to need help). The
      preposition lengthens to во before an awkward cluster (во вре́мени).

  # ── Adjectives ──────────────────────────────────────────────────────────
  adj-agreement:
    title: "Adjective agreement"
    formula: "agrees in gender · number · case with its noun"
    explanation: >
      An adjective copies the gender, number and case of the noun it modifies.
      Feminine singular endings are the clearest: -ая (nominative) → -ую
      (accusative). Hard stems take -ый/-ой, -ая, -ое, -ые; soft stems and
      stems after к/г/х and ж/ш/щ/ч take -ий, -яя, -ее, -ие. With an animate
      masculine singular or any animate plural noun, an agreeing adjective uses
      the genitive-shaped accusative: ви́жу но́вого студе́нта, ста́рых друзе́й.
      Inanimate plurals keep the nominative-shaped accusative: ви́жу ста́рые
      столы́.

  adj-short-form:
    title: "Short-form adjective"
    formula: "predicate: agrees in gender · number, no case"
    explanation: >
      Many adjectives have a short (predicative) form used after «быть» and as
      the predicate — «Магази́н закры́т», «Она́ гото́ва», «Мы ра́ды». It agrees
      with the subject in gender and number only (m/f/n/pl) and takes no case:
      закры́т, закры́та, закры́то, закры́ты. The masculine often inserts a fill
      vowel (согла́сен, у́годен) and the feminine/plural stress frequently shifts
      to the ending (больна́, темно́, горды́). Predicative-only words like рад and
      до́лжен exist only in this short form.
  adj-acc-animate:
    exception: true
    title: "Accusative of adjectives with animate nouns = genitive"
    formula: "animate acc = genitive (masc sg & all plural)"
    explanation: >
      When an adjective agrees with an animate noun (a person or animal), its
      accusative copies the GENITIVE — for the masculine singular and for the
      plural of every gender. Ви́жу хоро́шего дру́га (= gen хоро́шего), зна́ю но́вых
      сосе́дей (= gen pl но́вых). The context — a direct object of a verb like
      ви́деть or знать — tells you it is the accusative, even though the form
      looks genitive.
    exceptions:
      - "Feminine singular is unchanged: -ую either way (ви́жу но́вую подру́гу)."
      - "Neuter has no animate class; its accusative always equals the nominative."

  # ── Degrees of comparison ────────────────────────────────────────────────
  # The comparative is one invariable word — no gender, number or case — so the
  # whole skill is producing it from the dictionary form. The regular -ее ending
  # and the stem-changing set are split into separate rules so the hard forms
  # (they are flagged as exceptions) surface more often in the drill.
  adj-comparative:
    title: "Comparative adjective"
    formula: "stem + -ее · than = чем … or the plain genitive"
    explanation: >
      The comparative says "more X" or "X-er" and is ONE word, not two: краси́вый
      → краси́вее, интере́сный → интере́снее. It never changes — no gender, number
      or case — because it is used as a predicate, after быть or on its own:
      Э́та кни́га интере́снее. Say what you are comparing with either «чем» + the
      nominative (Она́ ста́рше, чем я) or, more compactly, the bare GENITIVE
      (Она́ ста́рше меня́); «на» + the accusative gives the margin (на год ста́рше,
      "a year older"). Stress: two-syllable adjectives pull it onto the ending
      (умне́е, сильне́е), longer ones keep it on the stem (краси́вее, удо́бнее).
    exceptions:
      - "Two-word alternative: бо́лее + the dictionary form (бо́лее сло́жный), the only option before a noun — «бо́лее сло́жная зада́ча», never «сложне́е зада́ча»."
      - "«ме́нее» is the negative counterpart and is always two words: ме́нее ва́жный."
      - "по- softens it: подо́льше, полу́чше — \"a bit longer / a bit better\"."
  adj-comparative-stem:
    exception: true
    title: "Comparative with a stem change"
    formula: "-к / -г / -х / -д / -т stems → -е + a mutated consonant"
    explanation: >
      A large group of common adjectives builds the comparative with a bare -е
      instead of -ее, and the final stem consonant mutates in front of it: г→ж
      (дорого́й → доро́же), к→ч (гро́мкий → гро́мче), х→ш (ти́хий → ти́ше), д→ж
      (молодо́й → моло́же), т→ч (бога́тый → бога́че), ст→щ (просто́й → про́ще),
      з→ж (у́зкий → у́же). The -к- of the -кий adjectives usually drops first
      (ни́зкий → ни́же, бли́зкий → бли́же). These forms are always stem-stressed.
      Four are suppletive and simply have to be learnt: хоро́ший → лу́чше,
      плохо́й → ху́же, большо́й → бо́льше, ма́ленький → ме́ньше.
    exceptions:
      - "Suppletive: хоро́ший → лу́чше · плохо́й → ху́же · большо́й → бо́льше · ма́ленький → ме́ньше."
      - "Irregular stems: далёкий → да́льше, до́лгий → до́льше, ста́рый → ста́рше (people), глубо́кий → глу́бже."
      - "ста́рше is for people's ages; a thing that is older is бо́лее ста́рый."
  adv-comparative:
    title: "Comparative adverb"
    formula: "same form as the comparative adjective · stem + -ее"
    explanation: >
      An adverb's comparative is spelled exactly like the adjective's — бы́стро
      and бы́стрый both give быстре́е — so there is only one form to learn per
      root. What differs is what it attaches to: the adverb modifies a VERB
      (Он бе́гает быстре́е) where the adjective describes a noun (Его́ маши́на
      быстре́е). Comparison works the same way: «чем» + the nominative or the
      bare genitive (Он говори́т ти́ше меня́).
    exceptions:
      - "«бо́лее» + an adverb is unidiomatic — say быстре́е, not «бо́лее бы́стро»."
      - "Ordinary adverbs have no superlative; use лу́чше всех / бо́льше всего́ (\"best of all\")."
  adv-comparative-stem:
    exception: true
    title: "Comparative adverb with a stem change"
    formula: "-е + a mutated consonant · ти́хо → ти́ше, до́рого → доро́же"
    explanation: >
      The same stem-changing group as the adjectives, and the same forms:
      гро́мко → гро́мче, ти́хо → ти́ше, до́рого → доро́же, легко́ → ле́гче, ча́сто →
      ча́ще, ре́дко → ре́же, чи́сто → чи́ще, ко́ротко → коро́че. The suppletives are
      the ones a learner meets first and most often: хорошо́ → лу́чше, пло́хо →
      ху́же, мно́го → бо́льше, ма́ло → ме́ньше, ра́но → ра́ньше, по́здно → по́зже,
      далеко́ → да́льше, бли́зко → бли́же.
    exceptions:
      - "Suppletive: хорошо́ → лу́чше · пло́хо → ху́же · мно́го → бо́льше · ма́ло → ме́ньше."
      - "ра́но → ра́ньше and по́здно → по́зже change the stem outright."
  adj-superlative:
    title: "Superlative: са́мый + adjective"
    formula: "са́мый + the adjective · BOTH agree in gender, number and case"
    explanation: >
      The everyday superlative — "the biggest", "the most interesting" — is two
      words: «са́мый» in front of the ordinary dictionary form. Both halves agree
      with the noun, so both change together: са́мый большо́й дом, са́мая больша́я
      кварти́ра, в са́мом большо́м до́ме. Unlike the comparative it is not a special
      form at all, which makes it the easier of the two degrees: if you can
      decline the adjective, you can say the superlative.
    exceptions:
      - "The comparative + всех/всего́ is the spoken alternative: Он бе́гает быстре́е всех."
      - "A bookish synthetic superlative in -е́йший / -а́йший exists (интере́снейший, велича́йший); it usually means \"extremely\", not \"the most\"."
      - "лу́чший and ху́дший already carry the meaning, so са́мый лу́чший is emphatic (and frowned on in careful writing)."

  # ── Pronouns ────────────────────────────────────────────────────────────
  pronoun-personal:
    title: "Personal pronoun"
    formula: "я → меня́/мне · ты → тебя́/тебе́ · он → его́/ему́/нём"
    explanation: >
      Personal pronouns (я, ты, он, она́, оно́, мы, вы, они́) change shape by
      case, often suppletively — the oblique stem is unrelated to the
      nominative. After a preposition the third-person forms add н-: у него́, о
      ней, с ни́ми. The reflexive себя́ has no nominative and refers back to the
      subject.
    exceptions:
      - "After prepositions он/она́/они́ start with н-: о нём, к ней, с ни́ми."
  pronoun-possessive:
    title: "Possessive pronoun"
    formula: "мой, твой, наш, свой agree like adjectives · его́/её/их never change"
    explanation: >
      Possessives мой, твой, наш, ваш and reflexive свой agree in gender, number
      and case with the thing possessed, just like adjectives: моя́ кни́га → мою́
      кни́гу → мое́й кни́ги. Use свой — not его́/её/их — when the owner is the
      subject of the clause: Он лю́бит свою́ рабо́ту ("his own") vs его́ рабо́ту
      (someone else's). The third-person его́, её, их are invariable — they never
      inflect.
    exceptions:
      - "его́, её, их (his/her/their) are indeclinable: его́ дом, его́ до́ма, его́ до́му."
  pronoun-demonstrative:
    title: "Demonstrative / determiner"
    formula: "э́тот, тот, весь, сам, ка́ждый, любо́й, како́й, кото́рый, чей agree like adjectives"
    explanation: >
      Demonstratives (э́тот, тот) and determiners (весь, сам, ка́ждый, любо́й,
      никако́й) and the relative/interrogative како́й, кото́рый, чей agree in
      gender, number and case with their noun: э́та кни́га → э́ту кни́гу; в ка́ждом
      до́ме; кото́рую я чита́ю.
  pronoun-interrogative:
    title: "Interrogative / indefinite"
    formula: "кто → кого́/кому́/кем · что → чего́/чему́/чем"
    explanation: >
      Question words кто and что and their indefinite (кто́-то, что́-то) and
      negative (никто́, ничто́) relatives decline by case only: кому́ ты пи́шешь;
      чего́ ты бои́шься; ниче́м не интересу́ется. Russian doubles the negative —
      the pronoun AND the verb are both negated: Никто́ ничего́ не зна́ет. The
      negatives split around a preposition: ни с кем, ни о чём.
