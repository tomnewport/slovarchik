# conjunctions.yml — Russian conjunctions (союзы)
# Natural key: "<russian>=<english>" (disambiguates homophones).
# Stress is marked with a combining acute accent (´, U+0301) on the vowel.
# Monosyllabic words carry no mark (their single vowel is always stressed).
---
meta:
  type:
    coord: coordinating
    sub: subordinating
words:
  "а=and":
    cefr_level: A1
    type: coord
    accented: а
    en_gb:
      standard: and (drawing a gentle contrast — "whereas")
      alt:
        - but
        - whereas
    usage:
      - ru: Я чита́ю, а он пи́шет.
        en_gb: I am reading, and he is writing.
        en_alt:
          - I am reading, whereas he is writing.
      - ru: Он лю́бит чай, а я ко́фе.
        en_gb: He likes tea, whereas I like coffee.
        en_alt:
          - He likes tea, and I like coffee.
          - He likes tea, but I like coffee.
      - ru: Сего́дня тепло́, а вчера́ бы́ло хо́лодно.
        en_gb: Today it's warm, whereas yesterday it was cold.
        en_alt:
          - Today it is warm, but yesterday it was cold.
  "будто=as if":
    cefr_level: B1
    type: sub
    accented: бу́дто
    en_gb:
      standard: as if (introducing a comparison or supposition)
      alt:
        - as though
    usage:
      - ru: Он смо́трит на меня́, бу́дто не узнаёт.
        en_gb: He looks at me as if he doesn't recognise me.
      - ru: Она́ говори́т так, бу́дто всё зна́ет.
        en_gb: She speaks as if she knows everything.
        en_alt:
          - She talks as if she knows everything.
      - ru: Ти́хо, бу́дто все усну́ли.
        en_gb: It's quiet, as if everyone has fallen asleep.
  "да=and":
    cefr_level: A1
    type: coord
    accented: да
    en_gb:
      standard: and (colloquial conjunction joining clauses)
      alt:
        - but (in the adversative sense)
    usage:
      - ru: Купи́ хлеб да молоко́.
        en_gb: Buy bread and milk.
      - ru: Сиди́м да ждём.
        en_gb: We sit and wait.
      - ru: Стар да мудр.
        en_gb: Old and wise.
  "едва=hardly":
    cefr_level: B1
    type: sub
    accented: едва́
    en_gb:
      standard: "hardly (barely; also: as soon as)"
      alt:
        - as soon as
        - scarcely
    usage:
      - ru: Едва́ мы вы́шли, начался́ дождь.
        en_gb: Hardly had we left when it started to rain.
      - ru: Он едва́ успе́л на по́езд.
        en_gb: He barely caught the train.
        en_alt:
          - He only just made the train.
      - ru: Едва́ слы́шно её го́лос.
        en_gb: Her voice is hardly audible.
  "если=if":
    cefr_level: A1
    type: sub
    accented: е́сли
    en_gb:
      standard: if (introducing a condition)
    facts:
      - kind: note
        text: >-
          Introduces a condition that might really happen, with ordinary tenses:
          е́сли бу́дет дождь, мы оста́немся до́ма. Add бы and it turns into the
          unreal kind — е́сли бы был дождь, if it were raining.
        see: ["бы=would"]
    usage:
      - ru: Е́сли бу́дет дождь, мы оста́немся до́ма.
        en_gb: If it rains, we will stay at home.
      - ru: Е́сли хо́чешь, пойдём вме́сте.
        en_gb: If you want, let's go together.
        en_alt:
          - If you want, we will go together.
      - ru: Позвони́ мне, е́сли что́-то случи́тся.
        en_gb: Call me if anything happens.
        en_alt:
          - Call me if something happens.
  "и=and":
    cefr_level: A1
    type: coord
    accented: и
    en_gb:
      standard: and (joining like things)
    usage:
      - ru: Ма́ма и па́па до́ма.
        en_gb: Mum and dad are at home.
      - ru: Он чита́ет и пи́шет.
        en_gb: He reads and writes.
      - ru: Я купи́л хлеб и сыр.
        en_gb: I bought bread and cheese.
  "или=or":
    cefr_level: A1
    type: coord
    accented: и́ли
    en_gb:
      standard: or (offering an alternative)
    usage:
      - ru: Чай и́ли ко́фе?
        en_gb: Tea or coffee?
      - ru: Ты пойдёшь и́ли оста́нешься?
        en_gb: Will you go or stay?
      - ru: Возьми́ кра́сный и́ли си́ний.
        en_gb: Take the red one or the blue one.
  "как=as":
    cefr_level: A1
    type: sub
    accented: как
    en_gb:
      standard: as (in the way that; like)
      alt:
        - how
        - like
        - when
    facts:
      - kind: note
        text: >-
          Two jobs in one word. It asks how something is — как дела́? — and it
          compares: бе́лый как снег, white as snow.
    usage:
      - ru: Де́лай, как я говорю́.
        en_gb: Do as I say.
      - ru: Всё произошло́, как мы ожида́ли.
        en_gb: Everything happened as we expected.
      - ru: Он рабо́тает, как настоя́щий ма́стер.
        en_gb: He works like a true master.
        en_alt:
          - He works like a real master.
  "когда=when":
    cefr_level: A1
    type: sub
    accented: когда́
    en_gb:
      standard: when (at the time that)
    facts:
      - kind: note
        text: >-
          Both the question when? and the word that ties two events together:
          когда́ я пришёл, все спа́ли. As a joiner it always takes a comma.
    usage:
      - ru: Когда́ я приду́, я позвоню́.
        en_gb: When I arrive, I will call.
        en_alt:
          - When I come, I will call.
      - ru: Когда́ ты вернёшься, мы поговори́м.
        en_gb: When you come back, we'll talk.
        en_alt:
          - When you return, we will talk.
      - ru: Я был ма́леньким, когда́ мы перее́хали.
        en_gb: I was little when we moved.
        en_alt:
          - I was small when we moved.
  "либо=or":
    cefr_level: B1
    type: coord
    accented: ли́бо
    en_gb:
      standard: or (formal or literary alternative)
    usage:
      - ru: 'Реши́ сейча́с: ли́бо да, ли́бо нет.'
        en_gb: 'Decide now: either yes or no.'
      - ru: Прие́дем в суббо́ту ли́бо в воскресе́нье.
        en_gb: We'll come on Saturday or Sunday.
      - ru: Он ли́бо спит, ли́бо чита́ет.
        en_gb: He is either sleeping or reading.
  "но=but":
    cefr_level: A1
    type: coord
    accented: но
    en_gb:
      standard: but (introducing a contrast)
    facts:
      - kind: note
        text: >-
          Marks a real contrast — what follows is not what you would expect. а
          is the gentler one, setting two things side by side, and и simply
          adds.
        see: ["а=and", "и=and"]
    usage:
      - ru: Я хочу́ спать, но на́до рабо́тать.
        en_gb: I want to sleep, but I have to work.
      - ru: Дом ма́ленький, но ую́тный.
        en_gb: The house is small, but cosy.
      - ru: Я звони́л, но никто́ не отве́тил.
        en_gb: I called, but no one answered.
  "однако=however":
    cefr_level: B1
    type: coord
    accented: одна́ко
    en_gb:
      standard: however (introducing a contrast)
      alt:
        - yet
        - but
    usage:
      - ru: Он уста́л, одна́ко продолжа́л рабо́тать.
        en_gb: He was tired; however, he kept working.
        en_alt:
          - He was tired; however, he continued to work.
      - ru: Пого́да была́ плоха́я, одна́ко мы пошли́ в лес.
        en_gb: The weather was bad; however, we went to the forest.
      - ru: Зада́ча тру́дная, одна́ко интере́сная.
        en_gb: The task is difficult; however, it is interesting.
  "пока=while":
    cefr_level: A2
    type: sub
    accented: пока́
    en_gb:
      standard: while (during the time that)
      alt:
        - until (with "не")
    usage:
      - ru: Пока́ ты гото́вишь, я накро́ю на стол.
        en_gb: While you cook, I will lay the table.
        en_alt:
          - While you are cooking, I will lay the table.
      - ru: Пока́ идёт дождь, мы побу́дем до́ма.
        en_gb: While it's raining, we'll stay at home.
      - ru: Чита́й, пока́ есть вре́мя.
        en_gb: Read while there's time.
  "поскольку=since":
    cefr_level: B1
    type: sub
    accented: поско́льку
    en_gb:
      standard: since (because, given that)
      alt:
        - seeing as
    usage:
      - ru: Поско́льку он опозда́л, мы на́чали без него́.
        en_gb: Since he was late, we started without him.
      - ru: Поско́льку идёт дождь, возьми́ зонт.
        en_gb: Since it's raining, take an umbrella.
      - ru: Поско́льку магази́н закры́т, пойдём за́втра.
        en_gb: Since the shop is closed, we'll go tomorrow.
        en_alt:
          - Since the shop is closed, let's go tomorrow.
  "потому что=because":
    cefr_level: A1
    type: sub
    accented: потому́ что
    en_gb:
      standard: because (giving the reason)
    usage:
      - ru: Я не пришёл, потому́ что заболе́л.
        en_gb: I did not come because I fell ill.
      - ru: Она́ ра́да, потому́ что сдала́ экза́мен.
        en_gb: She is glad because she passed the exam.
      - ru: Мы оста́лись до́ма, потому́ что бы́ло хо́лодно.
        en_gb: We stayed at home because it was cold.
  "поэтому=therefore":
    cefr_level: A1
    type: coord
    accented: поэ́тому
    en_gb:
      standard: therefore (drawing a consequence)
      alt:
        - so
        - that is why
    usage:
      - ru: Шёл дождь, поэ́тому мы оста́лись до́ма.
        en_gb: It was raining, therefore we stayed at home.
      - ru: Я уста́л, поэ́тому ля́гу ра́но.
        en_gb: I'm tired, therefore I'll go to bed early.
      - ru: Он зна́ет язы́к, поэ́тому ему́ ле́гче.
        en_gb: He knows the language, therefore it's easier for him.
        en_alt:
          - He knows the language, so it is easier for him.
  "прежде=before":
    cefr_level: B1
    type: sub
    accented: пре́жде
    en_gb:
      standard: before (usually in "прежде чем" — before doing something)
    usage:
      - ru: Поду́май, пре́жде чем отве́тить.
        en_gb: Think before you answer.
        en_alt:
          - Think before answering.
      - ru: Вы́мой ру́ки, пре́жде чем есть.
        en_gb: Wash your hands before you eat.
      - ru: Пре́жде чем уйти́, закро́й окно́.
        en_gb: Before leaving, close the window.
  "раз=since":
    cefr_level: B1
    type: sub
    accented: раз
    en_gb:
      standard: "since (colloquial: if, seeing as)"
      alt:
        - if
    usage:
      - ru: Раз ты здесь, помоги́ мне.
        en_gb: Since you're here, help me.
      - ru: Раз обеща́л, сде́лай.
        en_gb: Since you promised, do it.
      - ru: Раз хо́лодно, наде́нь ша́пку.
        en_gb: Since it's cold, put on a hat.
  "словно=as if":
    cefr_level: B1
    type: sub
    accented: сло́вно
    en_gb:
      standard: as if (like, as though)
      alt:
        - like
    usage:
      - ru: Он молчи́т, сло́вно оби́делся.
        en_gb: He's silent, as if he's offended.
        en_alt:
          - He is silent, as if he had taken offence.
      - ru: Снег па́дал, сло́вно пух.
        en_gb: The snow was falling like down.
      - ru: Она́ улыба́ется, сло́вно ребёнок.
        en_gb: She smiles like a child.
  "так=so":
    cefr_level: B1
    type: coord
    accented: так
    en_gb:
      standard: so (therefore, as a result — conjunction use)
      alt:
        - therefore
    usage:
      - ru: Бы́ло по́здно, так что мы ушли́.
        en_gb: It was late, so we left.
      - ru: Дождь ко́нчился, так пойдём гуля́ть.
        en_gb: The rain has stopped, so let's go for a walk.
      - ru: Ты уста́ла, так отдохни́.
        en_gb: You're tired, so rest.
      - ru: Вре́мени ма́ло, так поспеши́.
        en_gb: There's little time, so hurry.
  "так как=since":
    cefr_level: B1
    type: sub
    accented: так как
    en_gb:
      standard: since (because, giving a reason)
      alt:
        - as
        - because
    usage:
      - ru: Так как бы́ло по́здно, мы реши́ли оста́ться.
        en_gb: Since it was late, we decided to stay.
      - ru: Так как идёт дождь, мы оста́немся до́ма.
        en_gb: Since it's raining, we'll stay at home.
      - ru: Так как он бо́лен, уро́ка не бу́дет.
        en_gb: Since he is ill, there will be no lesson.
  "тогда=then":
    cefr_level: A2
    type: coord
    accented: тогда́
    en_gb:
      standard: then (in that case; at that time — conjunction use)
      alt:
        - in that case
    usage:
      - ru: Я позвоню́ тогда́ же, как обы́чно.
        en_gb: I will call at the same time as usual.
      - ru: Е́сли уста́л, тогда́ отдохни́.
        en_gb: If you're tired, then rest.
      - ru: Не хо́чешь? Тогда́ не на́до.
        en_gb: You don't want to? Then don't.
        en_alt:
          - You don't want to? Then there's no need.
      - ru: Зако́нчишь рабо́ту — тогда́ пойдём.
        en_gb: When you finish the work, then we'll go.
  "тоже=also":
    cefr_level: A1
    type: coord
    accented: то́же
    en_gb:
      standard: also (too, as well — conjunction use)
      alt:
        - too
    usage:
      - ru: Я уста́л, и она́ то́же.
        en_gb: I'm tired, and she is too.
      - ru: Он пришёл, и брат то́же.
        en_gb: He came, and his brother too.
      - ru: Мне нра́вится му́зыка, и тебе́ то́же.
        en_gb: I like music, and you do too.
  "хоть=although":
    cefr_level: B1
    type: sub
    accented: хоть
    en_gb:
      standard: "although (colloquial variant of хотя; also: at least)"
      alt:
        - at least
        - even if
    usage:
      - ru: Хоть и по́здно, я всё равно́ позвоню́.
        en_gb: Although it's late, I'll call anyway.
      - ru: Хоть он молодо́й, он о́пытный.
        en_gb: Although he is young, he is experienced.
      - ru: Дай хоть немно́го воды́.
        en_gb: Give me at least a little water.
  "хотя=although":
    cefr_level: A2
    type: sub
    accented: хотя́
    en_gb:
      standard: although (admitting a contrast)
      alt:
        - though
    usage:
      - ru: Хотя́ бы́ло хо́лодно, мы пошли́ гуля́ть.
        en_gb: Although it was cold, we went for a walk.
      - ru: Хотя́ он уста́л, он не оста́вил рабо́ту.
        en_gb: Although he was tired, he did not abandon the work.
      - ru: Я согла́сен, хотя́ есть сомне́ния.
        en_gb: I agree, although there are doubts.
  "чем=than":
    cefr_level: A2
    type: sub
    accented: чем
    en_gb:
      standard: than (in a comparison)
    usage:
      - ru: Он вы́ше, чем я.
        en_gb: He is taller than me.
      - ru: Здесь тепле́е, чем на у́лице.
        en_gb: It's warmer here than outside.
      - ru: Лу́чше по́здно, чем никогда́.
        en_gb: Better late than never.
  "что=that":
    cefr_level: A1
    type: sub
    accented: что
    en_gb:
      standard: that (introducing a reported clause)
    usage:
      - ru: Я зна́ю, что ты прав.
        en_gb: I know that you are right.
      - ru: Он сказа́л, что прие́дет за́втра.
        en_gb: He said that he would come tomorrow.
        en_alt:
          - He said that he would arrive tomorrow.
      - ru: Хорошо́, что ты пришёл.
        en_gb: It's good that you came.
  "чтоб=so that":
    cefr_level: B1
    type: sub
    accented: чтоб
    en_gb:
      standard: so that (colloquial variant of чтобы)
      alt:
        - in order to
    usage:
      - ru: Говори́ ти́ше, чтоб не разбуди́ть дете́й.
        en_gb: Speak more quietly so as not to wake the children.
      - ru: Я пришла́ ра́но, чтоб успе́ть.
        en_gb: I came early so that I'd be in time.
      - ru: Закро́й дверь, чтоб не ду́ло.
        en_gb: Close the door so there's no draught.
  "чтобы=in order to":
    cefr_level: A2
    type: sub
    accented: что́бы
    en_gb:
      standard: in order to (expressing purpose)
      alt:
        - so that
    usage:
      - ru: Я учу́сь, что́бы найти́ хоро́шую рабо́ту.
        en_gb: I study in order to find a good job.
        en_alt:
          - I am studying in order to find a good job.
      - ru: Я вста́ла ра́но, что́бы успе́ть на по́езд.
        en_gb: I got up early in order to catch the train.
      - ru: Она́ занима́ется, что́бы хорошо́ говори́ть.
        en_gb: She studies in order to speak well.
