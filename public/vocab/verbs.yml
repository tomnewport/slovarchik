meta:
  aspect:
    impf: imperfective
    pf: perfective
  conjugation:
    present: present tense (imperfective)
    future: simple future (быть)
    "1sg": "I"
    "2sg": "you (informal)"
    "3sg": "he / she / it"
    "1pl": "we"
    "2pl": "you (plural)"
