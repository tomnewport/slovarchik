# verbs.yml — Russian verbs
# `accented` holds the infinitive (dictionary form) with stress marked.
---
meta:
  aspect:
    impf: imperfective
    pf: perfective
  conjugation:
    present: present tense (imperfective)
    future: simple future (быть)
    "1sg": "I"
    "2sg": "you (informal)"
    "3sg": "he / she / it"
    "1pl": "we"
    "2pl": "you (plural)"
    "3pl": "they"
    past_m: past, masculine subject
    past_f: past, feminine subject
    past_n: past, neuter subject
    past_pl: past, plural subject
words:
  "арестовать=to arrest":
    cefr_level: B2
    accented: арестова́ть
    aspect: pf
    collections:
      - the law
    en_gb:
      standard: to arrest (to take into police custody)
    conjugation:
      future:
        "1sg": аресту́ю
        "2sg": аресту́ешь
        "3sg": аресту́ет
        "1pl": аресту́ем
        "2pl": аресту́ете
        "3pl": аресту́ют
      past_m: арестова́л
      past_f: арестова́ла
      past_n: арестова́ло
      past_pl: арестова́ли
    usage:
      - ru: Поли́ция арестова́ла во́ра.
        en_gb: The police arrested the thief.
      - ru: Его́ арестова́ли вчера́ ве́чером.
