# People and places the shipped literature names, for dictionary lookup only.
#
# names.yml holds the common Russian given names, diminutives and patronymics a
# learner meets everywhere (#760). These are the other kind: Chekhov's Нафанаи́л,
# the historical figures Lenin argues with, and the one German city he cites
# from. They are here so that tapping a capitalised word in the reader answers
# "this is a person" rather than nothing at all, and `learn: false` keeps every
# one of them out of the drills and the progress engine.
#
# Full singular paradigms rather than bare glosses: the books use these names in
# the oblique cases far more often than in the nominative («По Ма́рксу»,
# «Геростра́том»), and a paradigm also lets the popup say which case it is.
---
words:
  "Ванценбах=Wanzenbach":
    cefr_level: B2
    learn: false
    gender: f
    animacy: a
    number: ["sg"]
    en_gb:
      standard: "Wanzenbach (a German surname)"
    facts:
      - kind: note
        text: "A foreign surname borne by a woman does not decline in Russian, so every case looks the same."
    declension:
      sg_nom: Ванценба́х
