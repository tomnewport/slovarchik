# pronouns.yml — Russian pronouns (местоимения)
# Natural key: "<russian>=<english>" (disambiguates homophones).
# Stress is marked with a combining acute accent (´, U+0301) on the vowel.
#
# The `forms` block depends on the `type`:
#   pers / refl / inter (кто, что) / neg — the six cases (nom … pre) of the
#     single pronoun (reflexive себя has no nominative).
#   poss / demo / det / inter (какой, чей) — the nominative agreement forms
#     m / f / n / pl, because these decline like adjectives. The `accented`
#     headword is the masculine nominative.
#   A few pronouns (его, её, их, сколько) take no `forms` block: the possessives
#     его/её/их never change, and сколько is quantitative.
---
meta:
  type:
    pers: personal
    refl: reflexive
    poss: possessive
    demo: demonstrative
    det: determinative
    inter: interrogative
    neg: negative
  case:
    nom: nominative
    gen: genitive
    dat: dative
    acc: accusative
    ins: instrumental
    pre: prepositional
words:
  "ваш=your":
    cefr_level: A1
    type: poss
    accented: ваш
    en_gb:
      standard: your (belonging to "you" — plural or polite)
      alt:
        - yours
    usage:
      - ru: Э́то ваш дом?
        en_gb: Is this your house?
      - ru: Ва́ша кварти́ра о́чень больша́я.
        en_gb: Your flat is very big.
      - ru: Где ва́ши докуме́нты?
        en_gb: Where are your documents?
    forms:
      m: ваш
      f: ва́ша
      n: ва́ше
      pl: ва́ши
  "весь=all":
    cefr_level: A2
    type: det
    accented: весь
    en_gb:
      standard: all (the whole of something)
      alt:
        - the whole
    usage:
      - ru: Я прочита́л всю кни́гу.
        en_gb: I read the whole book.
      - ru: Весь день шёл дождь.
        en_gb: It rained all day.
      - ru: Все де́ти спят.
        en_gb: All the children are asleep.
    forms:
      m: весь
      f: вся
      n: всё
      pl: все
  "вы=you":
    cefr_level: A1
    type: pers
    accented: вы
    en_gb:
      standard: you (plural, or one person politely)
    usage:
      - ru: Вы говори́те по-ру́сски?
        en_gb: Do you speak Russian?
      - ru: Я хочу́ вам помо́чь.
        en_gb: I want to help you.
      - ru: Я ви́дел вас вчера́.
        en_gb: I saw you yesterday.
    forms:
      nom: вы
      gen: вас
      dat: вам
      acc: вас
      ins: ва́ми
      pre: вас
  "его=his":
    cefr_level: A2
    type: poss
    accented: его́
    en_gb:
      standard: his (belonging to him; this form never changes)
    usage:
      - ru: Э́то его́ маши́на.
        en_gb: This is his car.
      - ru: Его́ дом ря́дом со шко́лой.
        en_gb: His house is next to the school.
      - ru: Я люблю́ его́ пе́сни.
        en_gb: I love his songs.
