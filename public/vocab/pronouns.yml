# pronouns.yml — Russian pronouns (местоимения)
# Natural key: "<russian>=<english>" (disambiguates homophones).
# Stress is marked with a combining acute accent (´, U+0301) on the vowel.
#
# The `forms` block depends on the `type`:
#   pers / refl / inter (кто, что) / neg — the six cases (nom … pre) of the
#     single pronoun (reflexive себя has no nominative).
#   poss / demo / det / inter (какой, чей) — the nominative agreement forms
#     m / f / n / pl, because these decline like adjectives. The `accented`
#     headword is the masculine nominative. They also carry a `declension` block
#     with the full case × gender/number table (keys "<gender>_<case>", e.g.
#     m_gen, f_acc, pl_ins), curated and validated by
#     scripts/gen-pronoun-declension.mjs.
#   A few pronouns (его, её, их, сколько) take no `forms` block: the possessives
#     его/её/их never change, and сколько is quantitative.
---
meta:
  type:
    pers: personal
    refl: reflexive
    poss: possessive
    demo: demonstrative
    det: determinative
    inter: interrogative
    neg: negative
    indef: indefinite
  case:
    nom: nominative
    gen: genitive
    dat: dative
    acc: accusative
    ins: instrumental
    pre: prepositional
words:
  "ваш=your":
    cefr_level: A1
    type: poss
    accented: ваш
    en_gb:
      standard: your (belonging to "you" — plural or polite)
      alt:
        - yours
    usage:
      - ru: Э́то ваш дом?
        en_gb: Is this your house?
        inflect: { token: 2, case: nom, number: sg, gender: m, rule: pronoun-possessive }
      - ru: Ва́ша кварти́ра о́чень больша́я.
        en_gb: Your flat is very big.
        inflect: { token: 1, case: nom, number: sg, gender: f, rule: pronoun-possessive }
      - ru: Где ва́ши докуме́нты?
        en_gb: Where are your documents?
        inflect: { token: 2, case: nom, number: pl, gender: pl, rule: pronoun-possessive }
    forms:
      m: ваш
      f: ва́ша
      n: ва́ше
      pl: ва́ши
    declension:
      m_nom: ваш
      m_gen: ва́шего
      m_dat: ва́шему
      m_acc: ваш
      m_ins: ва́шим
      m_pre: ва́шем
      n_nom: ва́ше
      n_gen: ва́шего
      n_dat: ва́шему
      n_acc: ва́ше
      n_ins: ва́шим
      n_pre: ва́шем
      f_nom: ва́ша
      f_gen: ва́шей
      f_dat: ва́шей
      f_acc: ва́шу
      f_ins: ва́шей
      f_pre: ва́шей
      pl_nom: ва́ши
      pl_gen: ва́ших
      pl_dat: ва́шим
      pl_acc: ва́ши
      pl_ins: ва́шими
      pl_pre: ва́ших
