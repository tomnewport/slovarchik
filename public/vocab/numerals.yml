# numerals.yml — Russian numerals (числительные)
# Natural key: "<russian>=<english>" (disambiguates homophones).
# Stress is marked with a combining acute accent (´, U+0301) on the vowel.
# Monosyllabic words carry no mark (their single vowel is always stressed).
#
# `value` is the number the word names, where it is a plain integer/decimal.
# `type` records the kind of numeral:
#   cardinal   — counting numbers (one, two, three …)
#   ordinal    — position in a sequence (first, second …); these decline like
#                adjectives and the `accented` form is the masculine nominative
#   collective — groups of people/young animals (двое, трое, оба …)
#   quantity   — words naming a fixed amount (a dozen, a pair, a half)
#   year       — a spelled-out calendar year
#
# `forms` records how the numeral changes:
#   cardinals  — the six cases (nom … pre). "один" also varies by gender and
#                number, so each of its cases is split into m / f / n / pl.
#                "два" has a feminine nominative/accusative "две" (noted in the
#                gloss); other cardinals share one set of case forms. The
#                accusative equals the nominative with inanimate nouns and the
#                genitive with animate ones.
#   ordinals   — the nominative agreement forms m / f / n / pl (they otherwise
#                decline exactly like adjectives).
# Years are spelled-out phrases; only the final word is declined in context
# (and becomes an ordinal — "в … году"), so they carry no `forms` block.
---
meta:
  type:
    cardinal: cardinal
    ordinal: ordinal
    collective: collective
    quantity: quantity
    year: year
  case:
    nom: nominative
    gen: genitive
    dat: dative
    acc: accusative
    ins: instrumental
    pre: prepositional
