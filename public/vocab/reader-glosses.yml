# Reader-only glosses: the words the shipped literature uses and the curriculum
# does not teach (#782).
#
# Every tappable word in a book must resolve through the ordinary dictionary —
# a book pack carries no lexicon of its own — so a word with no entry is a word
# the reader silently refuses to explain. These entries close that gap without
# putting Chekhov's civil-service ranks or Lenin's «каутскиа́нство» into anyone's
# drills: `learn: false` keeps them out of the vocab, inflection and phrase
# drills and out of the batch/progress engine entirely.
#
# Unlike the auto-generated glossary.yml, whose keys are surface forms, these
# are keyed by the word's own dictionary form, with `forms:` listing the surface
# forms the books actually print. A reader who taps «противоре́чия» is better
# served by «противоре́чие — antagonism» than by an entry that only exists in the
# genitive, and a reader-only word has no paradigm anywhere else to conflict
# with. Where a full paradigm earns its keep the word belongs in
# reader-nouns.yml (declinable nouns) or reader-names.yml (people and places).
#
# `npm run check:reader` fails the build when a book uses a word none of these
# files explains. docs/reader-glosses.md says how to add one, and which of these
# words deserve promotion to real curriculum entries.
