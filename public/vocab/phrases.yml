# phrases.yml — annotated example phrases for the in-context inflection drill.
#
# Each entry is a CORRECT, stress-marked Russian sentence plus an annotation of
# the single token being taught: its grammatical slot (case+number for nouns,
# adjectives and pronouns; tense+person for verbs) and an optional `rule:` id
# pointing into grammar-rules.yml. `token` is the 1-based index of the target in
# the whitespace-split `ru` (punctuation stays attached to its word); its word
# core must equal the inflected answer.
#
# Coverage is per-INFLECTION-TYPE, not per word: not every word has a phrase for
# every case, but each kind of inflection is represented across subjects. See
# docs/phrase-context-redesign.md. Schema: public/vocab/CONTRIBUTING.md.
---
