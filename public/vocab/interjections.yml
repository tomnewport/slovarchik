    usage:
      - ru: Го́споди, как я уста́ла!
        en_gb: Good lord, how tired I am!
      - ru: Го́споди, что за шум?
        en_gb: Good lord, what is this noise?
        en_alt:
          - Good lord, what's that noise?
      - ru: Го́споди, наконе́ц-то ты до́ма.
        en_gb: Good lord, you're finally home.
  "да=yes":
    cefr_level: A1
    type: resp
    accented: да
    en_gb:
      standard: yes (agreement or confirmation)
    usage:
      - ru: Ты гото́в? — Да.
        en_gb: Are you ready? — Yes.
      - ru: Да, я согла́сен с тобо́й.
        en_gb: Yes, I agree with you.
      - ru: Э́то твоя́ кни́га? — Да.
        en_gb: Is this your book? — Yes.
  "даже=even":
    cefr_level: A2
    type: particle
    accented: да́же
    en_gb:
      standard: even (emphatic particle adding emphasis or surprise)
    usage:
      - ru: Да́же де́ти э́то зна́ют.
        en_gb: Even children know this.
      - ru: Он не сказа́л да́же сло́ва.
        en_gb: He didn't say even a word.
      - ru: Да́же сего́дня идёт дождь.
        en_gb: Even today it's raining.
  "де=reportedly":
    cefr_level: C1
    learn: false
    type: particle
    accented: де
    en_gb:
      standard: reportedly (archaic particle indicating reported speech)
    usage:
      - ru: Он, де, прие́дет за́втра.
        en_gb: He, reportedly, will arrive tomorrow.
      - ru: Она́, де, ничего́ не зна́ла.
        en_gb: She, supposedly, knew nothing.
      - ru: Они́, де, уже́ ушли́.
        en_gb: They, reportedly, have already left.
  "дескать=supposedly":
    cefr_level: C1
    type: particle
    accented: де́скать
    en_gb:
      standard: supposedly (introducing words quoted from someone else, often with doubt)
      alt:
        - so they say
    usage:
      - ru: Он сказа́л, де́скать, у него́ не́ было вре́мени.
        en_gb: He said that supposedly he had no time.
      - ru: Она́ отвеча́ет, де́скать, э́то не её де́ло.
        en_gb: She answers that supposedly it is none of her business.
