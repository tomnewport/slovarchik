    usage:
      - ru: Здра́вствуй, как твои́ дела́?
        en_gb: Hello, how are you?
  "здравствуйте=hello":
    cefr_level: A1
    type: greet
    accented: здра́вствуйте
    en_gb:
      standard: hello (polite or to more than one person)
    usage:
      - ru: Здра́вствуйте, как ва́ши дела́?
        en_gb: Hello, how are you?
      - ru: Здра́вствуйте, рад вас ви́деть.
        en_gb: Hello, glad to see you.
      - ru: Здра́вствуйте, проходи́те, пожа́луйста.
        en_gb: Hello, please come in.
    facts:
      - kind: origin
        text: "Be healthy: the same root as здоро́вый. The everyday greeting is literally a wish for the other person's health."
        see: ["здоровый=healthy"]
