    accented: до свида́ния
    en_gb:
      standard: goodbye (literally "until the meeting")
    usage:
      - ru: До свида́ния, до за́втра!
        en_gb: Goodbye, see you tomorrow!
        en_alt:
          - Goodbye, until tomorrow!
      - ru: До свида́ния, спаси́бо за всё.
        en_gb: Goodbye, thank you for everything.
      - ru: Ну, до свида́ния!
        en_gb: Well, goodbye!
  "доброе утро=good morning":
