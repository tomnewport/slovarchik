# interjections.yml — Russian interjections and discourse words (междометия)
# Natural key: "<russian>=<english>" (disambiguates homophones).
# Stress is marked with a combining acute accent (´, U+0301) on the vowel.
# Monosyllabic words carry no mark (their single vowel is always stressed).
---
meta:
  type:
    greet: greeting
    excl: exclamation
    polite: politeness
    resp: response
    particle: particle
words:
  "авось=with luck":
    cefr_level: B2
    type: particle
    accented: аво́сь
    en_gb:
      standard: with luck (hoping it somehow turns out fine, with no plan behind it)
      alt:
        - hopefully (trusting to chance)
    usage:
      - ru: Аво́сь всё обойдётся.
        en_gb: With luck it will all work out.
      - ru: Он всё де́лает на аво́сь.
        en_gb: He does everything on the off chance.
      - ru: Аво́сь пого́да за́втра бу́дет лу́чше.
        en_gb: With luck the weather will be better tomorrow.
  "ага=yes":
    cefr_level: A1
    type: resp
    accented: ага́
    en_gb:
      standard: yes (informal agreement, uh-huh)
      alt:
        - uh-huh
        - yeah
    usage:
      - ru: Ага́, я поняла́ тебя́.
        en_gb: Uh-huh, I understood you.
      - ru: Ты придёшь? — Ага́.
        en_gb: Are you coming? — Yeah.
      - ru: Ага́, вот где ты был!
        en_gb: Aha, so that's where you were!
  "ай=oh":
    cefr_level: A2
    type: excl
    accented: ай
    en_gb:
      standard: oh (exclamation of pain or mild surprise)
    usage:
      - ru: Ай, как бо́льно!
        en_gb: Ow, that hurts!
        en_alt:
          - Ow, how painful!
      - ru: Ай, я не зна́ла э́того.
        en_gb: Oh, I didn't know that.
      - ru: Ай, кака́я больша́я соба́ка!
        en_gb: Oh, what a big dog!
  "алло=hello":
    cefr_level: A1
    type: greet
    accented: алло́
    en_gb:
      standard: hello (when answering the telephone)
    usage:
      - ru: Алло́! Кто говори́т?
        en_gb: Hello! Who is speaking?
      - ru: Алло́, я вас слу́шаю.
        en_gb: Hello, I'm listening.
      - ru: Алло́, э́то рестора́н?
        en_gb: Hello, is this the restaurant?
        en_alt:
          - Hello, is that the restaurant?
  "ах=ah":
    cefr_level: A2
    type: excl
    accented: ах
    en_gb:
      standard: ah (surprise, delight or dismay)
      alt:
        - oh
    usage:
      - ru: Ах, кака́я красота́!
        en_gb: Ah, what beauty!
      - ru: Ах, как жаль!
        en_gb: Ah, what a pity!
      - ru: Ах, я совсе́м забы́ла!
        en_gb: Oh, I completely forgot!
        en_alt:
          - Ah, I completely forgot!
  "боже=oh God":
    cefr_level: B1
    type: excl
    accented: бо́же
    en_gb:
      standard: oh God (exclamation of surprise or distress)
      alt:
        - good God
        - my God
    usage:
      - ru: Бо́же мой, что случи́лось?
        en_gb: My God, what happened?
      - ru: Бо́же, кака́я жара́!
        en_gb: Oh God, what heat!
      - ru: Бо́же, помоги́ нам.
        en_gb: Oh God, help us.
  "бы=would":
    cefr_level: A2
    type: particle
    accented: бы
    en_gb:
      standard: would (subjunctive or conditional particle)
      alt:
        - if only
    usage:
      - ru: Я бы хоте́ла ча́шку ча́я.
        en_gb: I would like a cup of tea.
      - ru: Без тебя́ я бы не спра́вилась.
        en_gb: Without you I wouldn't have managed.
      - ru: Пошли́ бы мы домо́й.
        en_gb: We should go home.
  "ведь=after all":
    cefr_level: B1
    type: particle
    accented: ведь
    en_gb:
      standard: after all (emphasising a reason or reminding)
      alt:
        - you know (seeking agreement)
    usage:
      - ru: Ты ведь зна́ешь э́то.
        en_gb: You know this, after all.
      - ru: Мы ведь друзья́.
        en_gb: We're friends, after all.
      - ru: Ведь уже́ по́здно.
        en_gb: It's already late, you know.
  "вон=there":
    cefr_level: A2
    type: particle
    accented: вон
    en_gb:
      standard: "there (pointing particle: look, over there)"
      alt:
        - look (directing attention)
    usage:
      - ru: Вон тот дом на углу́.
        en_gb: That house over there on the corner.
      - ru: Вон, посмотри́ напра́во.
        en_gb: Over there, look to the right.
      - ru: Вон она́ идёт.
        en_gb: There she comes.
  "всё-таки=all the same":
    cefr_level: B1
    type: particle
    accented: всё-таки
    en_gb:
      standard: all the same (in spite of what was just said)
      alt:
        - nevertheless
        - still (even so)
    usage:
      - ru: Бы́ло хо́лодно, но мы всё-таки пошли́ гуля́ть.
        en_gb: It was cold, but we went for a walk all the same.
      - ru: Ты всё-таки был прав.
        en_gb: You were right after all.
      - ru: Э́то всё-таки сли́шком до́рого.
        en_gb: All the same, that is too expensive.
  "господи=good lord":
    cefr_level: B1
    type: excl
    accented: го́споди
    en_gb:
      standard: good lord (exclamation of surprise, dismay or relief)
      alt:
