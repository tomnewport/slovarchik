# adjectives.yml — Russian adjectives
# `accented` holds the masculine nominative singular (dictionary form).
# `forms` gives the nominative for each gender + plural (display headwords).
# `declension` gives the full case × gender/number table; keys are
# "<gender>_<case>", e.g. m_gen, f_acc, pl_ins. Accusative uses the inanimate
# (= nominative) forms for m/n/pl. Generated and validated by
# scripts/gen-adjective-declension.mjs.
---
meta:
  form:
    m: masculine nominative singular
    f: feminine nominative singular
    n: neuter nominative singular
    pl: nominative plural
    comparative: comparative degree
  gender:
    m: masculine
    n: neuter
    f: feminine
    pl: plural
  case:
    nom: nominative
    gen: genitive
    dat: dative
    acc: accusative
    ins: instrumental
    pre: prepositional
