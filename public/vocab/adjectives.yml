# adjectives.yml — Russian adjectives
# `accented` holds the masculine nominative singular (dictionary form).
# `forms` gives the nominative for each gender + plural (display headwords).
# `declension` gives the full case × gender/number table; keys are
# "<gender>_<case>", e.g. m_gen, f_acc, pl_ins. Accusative uses the inanimate
# (= nominative) forms for m/n/pl. Generated and validated by
# scripts/gen-adjective-declension.mjs.
---
meta:
  form:
    m: masculine nominative singular
    f: feminine nominative singular
    n: neuter nominative singular
    pl: nominative plural
    comparative: comparative degree
  gender:
    m: masculine
    n: neuter
    f: feminine
    pl: plural
  case:
    nom: nominative
    gen: genitive
    dat: dative
    acc: accusative
    ins: instrumental
    pre: prepositional
words:
  "автобусный=bus":
    cefr_level: B1
    accented: авто́бусный
    en_gb:
      standard: bus (relating to buses)
    collections:
      - travel
    forms:
      m: авто́бусный
      f: авто́бусная
      n: авто́бусное
      pl: авто́бусные
    usage:
      - ru: Я купи́ла авто́бусный биле́т.
        en_gb: I bought a bus ticket.
        inflect: { token: 3, case: acc, number: sg, gender: m, rule: adj-agreement }
      - ru: Авто́бусная остано́вка ря́дом с до́мом.
        en_gb: The bus stop is near the house.
        inflect: { token: 1, case: nom, number: sg, gender: f, rule: adj-agreement }
      - ru: Здесь то́лько авто́бусные биле́ты.
        en_gb: There are only bus tickets here.
        inflect: { token: 3, case: nom, number: pl, gender: pl, rule: adj-agreement }
