# adjectives.yml — Russian adjectives
# `accented` holds the masculine nominative singular (dictionary form).
# `forms` gives the nominative for each gender + plural.
---
meta:
  form:
    m: masculine nominative singular
    f: feminine nominative singular
    n: neuter nominative singular
    pl: nominative plural
    comparative: comparative degree
words:
  "белый=white":
    cefr_level: A1
    accented: бе́лый
    collections:
      - colours and textures
    en_gb:
      standard: white (the colour of snow)
    usage:
      - ru: На столе́ лежи́т бе́лый лист бума́ги.
        en_gb: A white sheet of paper lies on the table.
    forms:
      m: бе́лый
      f: бе́лая
      n: бе́лое
      pl: бе́лые
      comparative: беле́е
